name: Release

# A release is cut by pushing a tag on main; nothing publishes on ordinary
# pushes. Versioning is classic two-part (0.9, 1.0, 1.1), and ada83.c holds the
# number in ADA83_VERSION_MAJOR / _MINOR, read by .github/version.sh.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the version out of ada83.c
        id: version
        shell: bash
        run: echo "version=$(./.github/version.sh)" >> "$GITHUB_OUTPUT"

      # Only a tag push can publish, so only a tag push has to pass the gate.
      # A manual run is a dry run off a branch: it builds and checks the
      # archives, and stops before `publish`.
      - name: Tag must match ada83.c, sit on main, and be unreleased
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          source_version="${{ steps.version.outputs.version }}"

          if [[ $tag_name != "v$source_version" ]]; then
            echo "::error file=ada83.c::tag $tag_name does not match the compiled version v$source_version. Retag, or fix ADA83_VERSION_MAJOR/_MINOR."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag_name points at a commit that is not on main."
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "::error::a release for $tag_name already exists; versions are published once."
            exit 1
          fi

  # `make package` builds the compiler, the platform artwork and the VS Code
  # extension, then packs bin-<platform>.zip. The extension is not published
  # separately: every archive carries a copy.
  package:
    name: package (${{ matrix.platform }})
    needs: [verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The runners carry no LLVM. ada83 dlopens libLLVM to emit native code,
      # so without it the packaged compiler cannot get past --ir.
      - name: Install the toolchain (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm

      - name: Install the toolchain (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # The clang on the image targets MSVC, so it drives lld-link and rejects
      # the mingw spellings ada83 emits (-lm, -Wl,--stack). MINGW64 clang and
      # lld are the combination that links: ada83 puts thread-local storage in
      # COFF weak externals, which GNU ld cannot resolve either.
      - name: Install the toolchain (Windows)
        if: matrix.platform == 'windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld

      - name: Package (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: make package TARGET=${{ matrix.platform }}

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: make.bat package

      # Only now, so that make.bat still compiles with the image's gcc: ada83
      # links through system(), which inherits this PATH, and the MINGW64
      # clang has to win over the MSVC-targeting one in the image.
      - name: Put MINGW64 ahead of the image toolchain
        if: matrix.platform == 'windows'
        shell: bash
        run: echo '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin' >> "$GITHUB_PATH"

      # The archives are built with different flags from CI, and on macOS as a
      # universal binary CI never produces, so what ships is not what the suite
      # ran against. Unpack it and take the compiler through a real compile,
      # link and run.
      - name: Check the packaged archive
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          unzip -q bin-${{ matrix.platform }}.zip -d verify
          cd verify

          case "${{ matrix.platform }}" in
            windows) compiler=./ada83.exe ;;
            *)       compiler=./ada83 ;;
          esac
          chmod +x "$compiler" 2>/dev/null || true

          "$compiler" --version
          "$compiler" --version | grep -q "ada83 $VERSION "

          printf '%s\n' \
            'WITH TEXT_IO;' \
            'PROCEDURE HELLO IS' \
            'BEGIN' \
            '   TEXT_IO.PUT_LINE ("packaged ada83 works");' \
            'END HELLO;' > hello.adb
          "$compiler" hello.adb -o hello
          program=./hello
          [[ -x $program ]] || program=./hello.exe
          "$program" | grep -qx "packaged ada83 works"

      # A universal binary missing a slice still runs on the machine that built
      # it, so the only way to catch that is to ask.
      - name: Check the macOS binary is universal
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          archs=$(lipo -archs verify/ada83)
          echo "slices: $archs"
          for want in arm64 x86_64; do
            grep -qw "$want" <<<"$archs" \
              || { echo "::error::bin-macos.zip is missing the $want slice (has: $archs)"; exit 1; }
          done

      # ada83.exe loads LLVM-C.dll at run time; without it the archive is inert
      # on any machine that does not already have LLVM.
      - name: Check the Windows archive carries its DLLs
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          unzip -l bin-windows.zip | grep -qi 'LLVM-C\.dll' \
            || { echo "::error::bin-windows.zip does not contain LLVM-C.dll"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: bin-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [package]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/*
