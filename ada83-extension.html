<!doctype html>
<meta charset="utf-8">
<title>Ada 83 for Visual Studio Code</title>

<script id="ada83-extension.js">
'use strict';

const { spawn } = require('child_process');
const fs = require('fs');
const os = require('os');
const path = require('path');
const vscode = require('vscode');

const Header_Terminator = '\r\n\r\n';

const Content_Length_Of = (Header) =>
  ((Match) => (Match === null ? null : Number (Match[1])))
    (/content-length:\s*(\d+)/i.exec (Header));

const Framed = (Message) =>
  ((Body) =>
     `Content-Length: ${Buffer.byteLength (Body, 'utf8')}` +
     Header_Terminator + Body)
    (JSON.stringify ({ jsonrpc: '2.0', ...Message }));

const Unframed = (Stream) => {
  const Split = Stream.indexOf (Header_Terminator);
  if (Split < 0) return { Messages: [], Remainder: Stream };

  const Length = Content_Length_Of (Stream.slice (0, Split));
  const Start = Split + Header_Terminator.length;

  if (Length === null) return Unframed (Stream.slice (Start));

  const Bytes = Buffer.from (Stream.slice (Start), 'utf8');
  if (Bytes.length < Length) return { Messages: [], Remainder: Stream };

  const Body = Bytes.slice (0, Length).toString ('utf8');
  const Rest = Unframed (Bytes.slice (Length).toString ('utf8'));
  return { Messages: [Body, ...Rest.Messages], Remainder: Rest.Remainder };
};

const Parsed = (Body) => {
  try { return JSON.parse (Body); } catch { return null; }
};

const Configured = (Name, Fallback) =>
  vscode.workspace.getConfiguration ('ada83').get (Name, Fallback);

const Opened_Folders = () => vscode.workspace.workspaceFolders ?? [];

const Opened_Folder = () => Opened_Folders ()[0] ?? null;

const Initialize = (Id) => ({
  id: Id,
  method: 'initialize',
  params: {
    processId: process.pid,
    rootUri: ((Folder) => (Folder === null ? null : Folder.uri.toString ()))
               (Opened_Folder ()),
    workspaceFolders:
      ((Folders) =>
         (Folders.length === 0
            ? null
            : Folders.map ((Folder) =>
                ({ uri: Folder.uri.toString (), name: Folder.name }))))
        (Opened_Folders ()),
    capabilities: {
      general: { positionEncodings: ['utf-16'] },
      textDocument: {
        publishDiagnostics: { relatedInformation: true },
        signatureHelp: { signatureInformation: { parameterInformation: {
          labelOffsetSupport: true } } },
      },
      workspace: { workspaceFolders: true },
    },
  },
});

const Initialized = () => ({ method: 'initialized', params: {} });

const Did_Open = (Document) => ({
  method: 'textDocument/didOpen',
  params: {
    textDocument: {
      uri: Document.uri.toString (),
      languageId: 'ada83',
      version: Document.version,
      text: Document.getText (),
    },
  },
});

const Did_Change = (Document) => ({
  method: 'textDocument/didChange',
  params: {
    textDocument: {
      uri: Document.uri.toString (),
      version: Document.version,
    },
    contentChanges: [{ text: Document.getText () }],
  },
});

const Did_Close = (Document) => ({
  method: 'textDocument/didClose',
  params: { textDocument: { uri: Document.uri.toString () } },
});

const Shutdown = (Id) => ({ id: Id, method: 'shutdown' });

const Exit = () => ({ method: 'exit' });

const Mapped = (Table, Fallback) => (Reported) => Table[Reported] ?? Fallback;

const Severity_Table = {
  1: vscode.DiagnosticSeverity.Error,
  2: vscode.DiagnosticSeverity.Warning,
  3: vscode.DiagnosticSeverity.Information,
  4: vscode.DiagnosticSeverity.Hint,
};

const Severity_Of = Mapped (Severity_Table, vscode.DiagnosticSeverity.Error);

const Range_Of = ({ start, end }) =>
  new vscode.Range (start.line, start.character, end.line, end.character);

const Related_Of = (Reported) =>
  new vscode.DiagnosticRelatedInformation (
    new vscode.Location (vscode.Uri.parse (Reported.location.uri),
                         Range_Of (Reported.location.range)),
    Reported.message ?? '');

const Diagnostic_Of = (Reported) =>
  Object.assign (
    new vscode.Diagnostic (Range_Of (Reported.range), Reported.message,
                           Severity_Of (Reported.severity)),
    { source: 'ada83',
      code: Reported.code,
      relatedInformation:
        (Reported.relatedInformation ?? []).map (Related_Of) });

const Location_Of = (Result) =>
  Result === null || Result === undefined
    ? null
    : new vscode.Location (vscode.Uri.parse (Result.uri),
                           Range_Of (Result.range));

const Is_Answer = (Message) =>
  Message !== null && Message.id !== undefined &&
  Message.method === undefined;

const Is_Publication = (Message) =>
  Message !== null && Message.method === 'textDocument/publishDiagnostics';

const Publication_Of = (Message) => ({
  Uri: vscode.Uri.parse (Message.params.uri),
  Diagnostics: (Message.params.diagnostics ?? []).map (Diagnostic_Of),
});

const Publications_In = (Messages) =>
  Messages.filter (Is_Publication).map (Publication_Of);

const Answers_In = (Messages) => Messages.filter (Is_Answer);

const Is_Ada_Document = (Document) =>
  Document.languageId === 'ada83' && Document.uri.scheme === 'file';

let Session = null;
let Next_Id = 10;
let Trace_Channel = null;
const Awaiting = new Map ();

let Tracing = 'off';

const Traced = (Direction, Message) => {
  if (Tracing === 'off' || Trace_Channel === null) return;
  Trace_Channel.appendLine (
    Tracing === 'verbose'
      ? `${Direction} ${JSON.stringify (Message)}`
      : `${Direction} ${Message.method ?? `id ${Message.id}`}`);
};

const Send = (Message) => {
  if (Session === null || !Session.Server.stdin.writable) return;
  Traced ('->', Message);
  Session.Server.stdin.write (Framed (Message));
};

const Settle = (Message) =>
  ((Resolve) => {
     if (Resolve === undefined) return;
     Traced ('<-', Message);
     Awaiting.delete (Message.id);
     Resolve (Message.result ?? null);
   }) (Awaiting.get (Message.id));

const Abandon_All = () =>
  [...Awaiting.entries ()].forEach (([Id, Resolve]) => {
    Awaiting.delete (Id);
    Resolve (null);
  });

const Receive = (Chunk) => {
  if (Session === null) return;
  const { Messages, Remainder } = Unframed (Session.Buffered + Chunk);
  Session.Buffered = Remainder;
  const Parsed_Messages = Messages.map (Parsed);
  Publications_In (Parsed_Messages).forEach (Publish);
  Answers_In (Parsed_Messages).forEach (Settle);
};

let Pending_Change = null;

const Flush_Changes = () => {
  if (Pending_Change === null) return;
  const { Timer, Notify, Document } = Pending_Change;
  clearTimeout (Timer);
  Pending_Change = null;
  Send (Notify (Document));
};

const Cancel = (Id) => ({ method: '$/cancelRequest', params: { id: Id } });

const Ask = (Build, Token, Patience) =>
  Session === null
    ? Promise.resolve (null)
    : ((Id) =>
         new Promise ((Resolve) => {
           Awaiting.set (Id, Resolve);
           Flush_Changes ();
           Send (Build (Id));
           const Abandon = (Notify) => () => {
             if (!Awaiting.delete (Id)) return;
             if (Notify) Send (Cancel (Id));
             Resolve (null);
           };
           const Waiting = setTimeout (
             Abandon (true),
             Patience ?? Configured ('requestTimeout', 15000));
           Token?.onCancellationRequested (() => {
             clearTimeout (Waiting);
             Abandon (true) ();
           });
         })) (Next_Id++);

const Highlight_Kind_Table = {
  1: vscode.DocumentHighlightKind.Text,
  2: vscode.DocumentHighlightKind.Read,
  3: vscode.DocumentHighlightKind.Write,
};

const Highlight_Kind_Of =
  Mapped (Highlight_Kind_Table, vscode.DocumentHighlightKind.Text);

const Highlight_Of = (Reported) =>
  new vscode.DocumentHighlight (Range_Of (Reported.range),
                                Highlight_Kind_Of (Reported.kind));

const Listed = (Convert) => (Result) =>
  Array.isArray (Result) ? Result.map (Convert) : [];

const Highlights_Of = Listed (Highlight_Of);

const Locations_Of = Listed (Location_Of);

const Hover_Of = (Result) =>
  Result === null || Result === undefined ||
  Result.contents === null || Result.contents === undefined
    ? null
    : new vscode.Hover (new vscode.MarkdownString (Result.contents.value),
                        Range_Of (Result.range));

const Symbol_Kind_Of = (Reported) =>
  Number.isInteger (Reported) && Reported >= 1 && Reported <= 26
    ? Reported - 1
    : vscode.SymbolKind.Variable;

const Symbol_Of = (Reported) =>
  new vscode.SymbolInformation (Reported.name,
                                Symbol_Kind_Of (Reported.kind),
                                Reported.containerName ?? '',
                                Location_Of (Reported.location));

const Symbols_Of = Listed (Symbol_Of);

const Completion_Kind_Table = {
  2: vscode.CompletionItemKind.Method,
  3: vscode.CompletionItemKind.Function,
  6: vscode.CompletionItemKind.Variable,
  9: vscode.CompletionItemKind.Module,
  14: vscode.CompletionItemKind.Keyword,
  20: vscode.CompletionItemKind.EnumMember,
  21: vscode.CompletionItemKind.Constant,
  22: vscode.CompletionItemKind.Struct,
  23: vscode.CompletionItemKind.Event,
};

const Completion_Kind_Of =
  Mapped (Completion_Kind_Table, vscode.CompletionItemKind.Text);

const Completion_Item_Of = (Reported) =>
  Object.assign (
    new vscode.CompletionItem (Reported.label,
                               Completion_Kind_Of (Reported.kind)),
    { detail: Reported.detail });

const Completions_Of = (Result) =>
  Result === null || Result === undefined
    ? null
    : (Result.items ?? []).map (Completion_Item_Of);

const Workspace_Symbols_Of = Listed (Symbol_Of);

const Parameter_Of = (Reported) =>
  new vscode.ParameterInformation (Reported.label);

const Signature_Of = (Reported) =>
  Object.assign (new vscode.SignatureInformation (Reported.label),
                 { parameters: (Reported.parameters ?? []).map (Parameter_Of) });

const Signature_Help_Of = (Result) =>
  Result === null || Result === undefined
    ? null
    : Object.assign (new vscode.SignatureHelp (), {
        signatures: (Result.signatures ?? []).map (Signature_Of),
        activeSignature: Result.activeSignature ?? 0,
        activeParameter: Result.activeParameter ?? 0,
      });

const Folding_Kind_Table = {
  comment: vscode.FoldingRangeKind.Comment,
  imports: vscode.FoldingRangeKind.Imports,
  region: vscode.FoldingRangeKind.Region,
};

const Folding_Range_Of = (Reported) =>
  new vscode.FoldingRange (Reported.startLine, Reported.endLine,
                           Folding_Kind_Table[Reported.kind]);

const Folding_Ranges_Of = Listed (Folding_Range_Of);

const Edited = (Edit, Uri, Replacements) => {
  Replacements.forEach ((Replacement) =>
    Edit.replace (vscode.Uri.parse (Uri), Range_Of (Replacement.range),
                  Replacement.newText));
  return Edit;
};

const Workspace_Edit_Of = (Changes) =>
  Object.keys (Changes ?? {}).reduce (
    (Edit, Uri) => Edited (Edit, Uri, Changes[Uri]),
    new vscode.WorkspaceEdit ());

const Code_Action_Of = (Reported) =>
  Object.assign (
    new vscode.CodeAction (Reported.title, vscode.CodeActionKind.QuickFix),
    { edit: Workspace_Edit_Of ((Reported.edit ?? {}).changes),
      isPreferred: Reported.isPreferred === true });

const Code_Actions_Of = Listed (Code_Action_Of);

const Text_Document_Of = (Document) => ({ uri: Document.uri.toString () });

const Position_Of = ({ line, character }) => ({ line, character });

const Range_Sent = ({ start, end }) =>
  ({ start: Position_Of (start), end: Position_Of (end) });

const At_Document = (Document) => ({ textDocument: Text_Document_Of (Document) });

const At_Position = (Document, Position) =>
  ({ ...At_Document (Document), position: Position_Of (Position) });

const At_References = (Document, Position, Context) =>
  ({ ...At_Position (Document, Position),
     context: { includeDeclaration: (Context ?? {}).includeDeclaration !== false } });

const At_Selection = (Document, Selection) =>
  ({ ...At_Document (Document), range: Range_Sent (Selection),
     context: { diagnostics: [] } });

const Semantic_Legend_Of = (Capability) =>
  new vscode.SemanticTokensLegend (
    (Capability ?? {}).legend?.tokenTypes ?? [],
    (Capability ?? {}).legend?.tokenModifiers ?? []);

const Semantic_Tokens_Of = (Result) =>
  Result === null || Result === undefined || !Array.isArray (Result.data)
    ? null
    : new vscode.SemanticTokens (Uint32Array.from (Result.data));

const Code_Lens_Of = (Reported) =>
  new vscode.CodeLens (Range_Of (Reported.range), Reported.command);

const Code_Lenses_Of = Listed (Code_Lens_Of);

const For_Query = (Query) => ({ query: Query ?? '' });

const Is_Cancellable = (Given) =>
  Given !== null && typeof Given === 'object' &&
  typeof Given.onCancellationRequested === 'function';

const Registers = (Register) => (Provider) => Register (Ada_Selector, Provider);

const Triggers = (Register, Name, Fallback) => (Provider, Capabilities) =>
  Register (Ada_Selector, Provider,
            ...((Capabilities[Name] ?? {}).triggerCharacters ?? Fallback));

const Language_Features = [
  { Capability: 'definitionProvider',        Provides: 'provideDefinition',
    Method: 'textDocument/definition',       Parameters: At_Position,
    Answer: Location_Of,
    Register: Registers (vscode.languages.registerDefinitionProvider) },
  { Capability: 'hoverProvider',             Provides: 'provideHover',
    Method: 'textDocument/hover',            Parameters: At_Position,
    Answer: Hover_Of,
    Register: Registers (vscode.languages.registerHoverProvider) },
  { Capability: 'documentHighlightProvider', Provides: 'provideDocumentHighlights',
    Method: 'textDocument/documentHighlight', Parameters: At_Position,
    Answer: Highlights_Of,
    Register: Registers (vscode.languages.registerDocumentHighlightProvider) },
  { Capability: 'referencesProvider',        Provides: 'provideReferences',
    Method: 'textDocument/references',       Parameters: At_References,
    Answer: Locations_Of,
    Register: Registers (vscode.languages.registerReferenceProvider) },
  { Capability: 'documentSymbolProvider',    Provides: 'provideDocumentSymbols',
    Method: 'textDocument/documentSymbol',   Parameters: At_Document,
    Answer: Symbols_Of,
    Register: Registers (vscode.languages.registerDocumentSymbolProvider) },
  { Capability: 'foldingRangeProvider',      Provides: 'provideFoldingRanges',
    Method: 'textDocument/foldingRange',     Parameters: At_Document,
    Answer: Folding_Ranges_Of,
    Register: Registers (vscode.languages.registerFoldingRangeProvider) },
  { Capability: 'codeActionProvider',        Provides: 'provideCodeActions',
    Method: 'textDocument/codeAction',       Parameters: At_Selection,
    Answer: Code_Actions_Of,
    Register: (Provider) =>
      vscode.languages.registerCodeActionsProvider (Ada_Selector, Provider,
        { providedCodeActionKinds: [vscode.CodeActionKind.QuickFix] }) },
  { Capability: 'completionProvider',        Provides: 'provideCompletionItems',
    Method: 'textDocument/completion',       Parameters: At_Position,
    Answer: Completions_Of,
    Register: Triggers (vscode.languages.registerCompletionItemProvider,
                        'completionProvider', ['.']) },
  { Capability: 'signatureHelpProvider',     Provides: 'provideSignatureHelp',
    Method: 'textDocument/signatureHelp',    Parameters: At_Position,
    Answer: Signature_Help_Of,
    Register: Triggers (vscode.languages.registerSignatureHelpProvider,
                        'signatureHelpProvider', ['(', ',']) },
  { Capability: 'workspaceSymbolProvider',   Provides: 'provideWorkspaceSymbols',
    Method: 'workspace/symbol',              Parameters: For_Query,
    Answer: Workspace_Symbols_Of,            Patience: 'workspaceRequestTimeout',
    Register: (Provider) =>
      vscode.languages.registerWorkspaceSymbolProvider (Provider) },

  { Capability: 'semanticTokensProvider',    Provides: 'provideDocumentSemanticTokens',
    Method: 'textDocument/semanticTokens/full', Parameters: At_Document,
    Answer: Semantic_Tokens_Of,
    Register: (Provider, Capabilities) =>
      vscode.languages.registerDocumentSemanticTokensProvider (
        Ada_Selector, Provider,
        Semantic_Legend_Of (Capabilities.semanticTokensProvider)) },
  { Capability: 'codeLensProvider',          Provides: 'provideCodeLenses',
    Method: 'textDocument/codeLens',         Parameters: At_Document,
    Answer: Code_Lenses_Of,
    Register: Registers (vscode.languages.registerCodeLensProvider) },
];

const Provider_For = ({ Method, Parameters, Answer, Provides, Patience }) => ({
  [Provides]: (...Given) =>
    Ask ((Id) => ({ id: Id, method: Method, params: Parameters (...Given) }),
         Given.find (Is_Cancellable),
         Patience === undefined ? undefined : Configured (Patience, 120000))
      .then (Answer),
});

const Offered = (Capabilities, Name) =>
  Capabilities[Name] !== undefined && Capabilities[Name] !== false;

const Registrations = (Capabilities) =>
  Language_Features
    .filter (({ Capability }) => Offered (Capabilities, Capability))
    .map ((Feature) => Feature.Register (Provider_For (Feature), Capabilities));

const Manual_Name = 'ada83-manual.md';
const Manual_Results = 4;
const Manual_Section_Words = 700;
const Manual_Total_Words = 2400;
const Manual_Saturation = 1.2;
const Manual_Balance = 0.75;
const Clause_Bonus = 100;
const Title_Bonus = 2.5;

const Any_Heading = /^#{1,6}\s+\S/;
const Numbered_Heading =
  /^#{2,6}\s+([0-9]+(?:\.[0-9]+)*|[A-Z])\.?\s+(\S.*?)\s*$/;
const Word_Pattern = /[a-z0-9_]+/g;
const Clause_Pattern = /\b[0-9]+(?:\.[0-9]+)+\b/g;
const Clause_Query = /\b[0-9]+(?:\.[0-9]+)*\b/g;

const Heading_Of = (Line) =>
  ((Match) =>
     (Match === null ? null : { Clause: Match[1], Title: Match[2] }))
    (Numbered_Heading.exec (Line));

const Heading_Marks = (Lines) =>
  Lines.reduce ((Marks, Line, Index) =>
    (Any_Heading.test (Line) ? [...Marks, Index] : Marks), []);

const Sectioned = (Text) =>
  ((Lines) =>
     ((Marks) =>
        Marks
          .map ((Start, Position) => ({
            Heading: Heading_Of (Lines[Start]),
            Body: Lines
              .slice (Start + 1, Marks[Position + 1] ?? Lines.length)
              .join ('\n').trim (),
          }))
          .filter (({ Heading }) => Heading !== null)
          .map (({ Heading, Body }) => ({ ...Heading, Body })))
       (Heading_Marks (Lines)))
    (Text.split (/\r?\n/));

const Tokens_Of = (Text) =>
  ((Lowered) => [...(Lowered.match (Word_Pattern) ?? []),
                 ...(Lowered.match (Clause_Pattern) ?? [])])
    (Text.toLowerCase ());

const Counted = (Words) => {
  const Counts = new Map ();
  Words.forEach ((Word) => Counts.set (Word, (Counts.get (Word) ?? 0) + 1));
  return Counts;
};

const Entry_Of = (Section) =>
  ((Counts) => ({
     Section,
     Counts,
     Length: [...Counts.values ()].reduce ((Sum, Count) => Sum + Count, 0),
     Title_Terms: new Set (Tokens_Of (`${Section.Clause} ${Section.Title}`)),
   }))
    (Counted (Tokens_Of (
       `${Section.Clause} ${Section.Title}\n${Section.Body}`)));

const Document_Frequencies = (Entries) => {
  const Frequencies = new Map ();
  Entries.forEach (({ Counts }) =>
    Counts.forEach ((_, Word) =>
      Frequencies.set (Word, (Frequencies.get (Word) ?? 0) + 1)));
  return Frequencies;
};

const Indexed = (Sections) =>
  ((Entries) => ({
     Entries,
     Frequencies: Document_Frequencies (Entries),
     Count: Entries.length,
     Average_Length:
       Entries.reduce ((Sum, { Length }) => Sum + Length, 0) /
       Math.max (1, Entries.length),
   }))
    (Sections.map (Entry_Of));

const Inverse_Frequency = (Count, Documents) =>
  Math.log (1 + (Count - Documents + 0.5) / (Documents + 0.5));

const Term_Score = (Index, Entry, Word) =>
  ((Frequency, Documents) =>
     Frequency === 0 || Documents === 0
       ? 0
       : Inverse_Frequency (Index.Count, Documents) *
         (Frequency * (Manual_Saturation + 1)) /
         (Frequency + Manual_Saturation *
            (1 - Manual_Balance +
             Manual_Balance * Entry.Length / Index.Average_Length)))
    (Entry.Counts.get (Word) ?? 0, Index.Frequencies.get (Word) ?? 0);

const Score_Of = (Index, Entry, Words, Clauses) =>
  (Clauses.includes (Entry.Section.Clause) ? Clause_Bonus : 0) +
  Words.reduce ((Total, Word) =>
    Total + Term_Score (Index, Entry, Word) +
    (Entry.Title_Terms.has (Word) ? Title_Bonus : 0), 0);

const Ranked = (Index, Query) =>
  ((Words, Clauses) =>
     Index.Entries
       .map ((Entry) => ({
         Section: Entry.Section,
         Score: Score_Of (Index, Entry, Words, Clauses),
       }))
       .filter (({ Score }) => Score > 0)
       .sort ((Left, Right) => Right.Score - Left.Score)
       .slice (0, Manual_Results)
       .map (({ Section }) => Section))
    ([...new Set (Tokens_Of (Query))],
     Query.match (Clause_Query) ?? []);

const Words_In = (Text) => (Text.match (/\S+/g) ?? []).length;

const Running_Words = (Lines) => {
  let Total = 0;
  return Lines.map ((Line) => (Total += Words_In (Line)));
};

const Clipped = (Text, Limit) =>
  Limit <= 0
    ? ''
    : ((Lines) =>
         ((Cut) =>
            (Cut < 0
               ? Text
               : `${Lines.slice (0, Cut + 1).join ('\n')}\n[...]`))
           (Running_Words (Lines).findIndex ((Count) => Count >= Limit)))
        (Text.split ('\n'));

const Budgeted = (Sections) => {
  let Remaining = Manual_Total_Words;
  return Sections
    .map ((Section) =>
       ((Body) => {
          Remaining -= Words_In (Body);
          return { ...Section, Body };
        })
         (Clipped (Section.Body,
                   Math.min (Manual_Section_Words, Remaining))))
    .filter (({ Body }) => Body.length > 0);
};

const Rendered = (Sections, Query) =>
  Sections.length === 0
    ? `No section of the Ada 83 manual matches "${Query}".`
    : ['Ada 83 Reference Manual (ANSI/MIL-STD-1815A), sections matching ' +
       `"${Query}":`,
       ...Budgeted (Sections).map (({ Clause, Title, Body }) =>
         `## ${Clause} ${Title}\n\n${Body}`)].join ('\n\n');

const Manual_Text = (Root) => {
  try { return fs.readFileSync (path.join (Root, Manual_Name), 'utf8'); }
  catch { return null; }
};

let Manual_Cache;

const Manual_Index = (Root) => {
  if (Manual_Cache === undefined)
    Manual_Cache =
      ((Text) => (Text === null ? null : Indexed (Sectioned (Text))))
        (Manual_Text (Root));
  return Manual_Cache;
};

const Searched = (Root, Query) =>
  Query.trim () === ''
    ? 'Ask for a clause number, such as 4.5.7, or for the wording to find.'
    : ((Index) =>
         Index === null
           ? `The Ada 83 manual (${Manual_Name}) is not installed beside ` +
             'the extension.'
           : Rendered (Ranked (Index, Query), Query.trim ()))
        (Manual_Index (Root));

const Manual_Tool = (Root) => ({
  invoke: (Options) =>
    new vscode.LanguageModelToolResult ([
      new vscode.LanguageModelTextPart (
        Searched (Root, String (Options.input?.query ?? '')))]),
});

const Manual_Registration = (Root) =>
  vscode.lm === undefined || vscode.lm.registerTool === undefined
    ? []
    : [vscode.lm.registerTool ('search_ada83_manual', Manual_Tool (Root))];

const Style_Heading = '## Style Guidelines';

const Style_Rules = (Root) =>
  ((Text) =>
     (Text === null || Text.indexOf (Style_Heading) < 0
        ? null
        : Text.slice (Text.indexOf (Style_Heading))))
    (Manual_Text (Root));

const Strengths = {
  indentation: 'Change only the leading whitespace of each line. Leave every ' +
               'other character exactly where it is.',
  layout: 'Change only whitespace: indentation, the alignment of declarations ' +
          'and comments, and where long lines break. Do not change the casing ' +
          'of anything.',
  style: 'Change layout, the casing of reserved words and identifiers, the ' +
         'canonical spelling of predefined names, and where comments sit.',
};

const Strength_Of = () =>
  Strengths[Configured ('formatStrength', 'style')] ?? Strengths.style;

const Reformat_Instruction = (Rules, Source) =>
  ['Rewrite the Ada 83 source below so that it follows the style rules that',
   'come after it.', Strength_Of (), 'Do not change what the program does:',
   'add and remove nothing, reorder nothing, and spell no name differently',
   'except in its casing. Ada 83 only, so nothing from a later Ada. Answer',
   'with the rewritten source alone, with no explanation and no code fence.',
   '', 'The source:', '', Source, '', 'The rules:', '', Rules].join ('\n');

const Unfenced = (Text) =>
  ((Match) => (Match === null ? Text : Match[1]))
    (/^\s*```(?:ada|ada83)?\r?\n([\s\S]*?)\r?\n```\s*$/.exec (Text));

const Spoken = async (Model, Prompt, Token) => {
  const Reply = await Model.sendRequest (
    [vscode.LanguageModelChatMessage.User (Prompt)], {}, Token);
  let Spelled = '';
  for await (const Fragment of Reply.text) Spelled += Fragment;
  return Spelled;
};

let Scratch_Serial = 0;

const Still_Compiles = (Source, Directory) =>
  new Promise ((Resolve) => {
    const Scratch = path.join (os.tmpdir (),
                               `ada83-reformat-${process.pid}-` +
                               `${++Scratch_Serial}.ada`);
    try { fs.writeFileSync (Scratch, Source); }
    catch { return Resolve (false); }
    const [Command, Arguments, Options] =
      Host_Escaped (Compiler_Path (), ['--analyse', Scratch, Directory],
                    Analysis_Environment ());
    const Child = spawn (Command, Arguments, Options);
    let Reply = '';
    Child.stdout.on ('data', (Chunk) => { Reply += Chunk; });
    Child.on ('error', () => Resolve (false));
    Child.on ('close', () => {
      try { fs.unlinkSync (Scratch); } catch { }
      const Reported = Parsed (Reply);
      Resolve (Array.isArray (Reported) &&
               !Reported.some (({ severity }) => severity === 0));
    });
  });

const Whole_Of = (Document) =>
  new vscode.Range (0, 0, Document.lineCount, 0);

const Reformatted = async (Root, Document, Token) => {
  const Rules = Style_Rules (Root);
  if (Rules === null)
    return { Complaint: `The style rules are in ${Manual_Name}, which is ` +
                        'not installed beside the extension.' };

  const Models = await vscode.lm.selectChatModels ({});
  if (Models.length === 0)
    return { Complaint: 'Reformatting asks a language model to apply the ' +
                        'style rules, and no model is available here.' };

  const Answer = Unfenced (
    await Spoken (Models[0], Reformat_Instruction (Rules, Document.getText ()),
                  Token)).trim ();
  if (Answer === '')
    return { Complaint: 'The model returned nothing.' };

  const Directory = path.dirname (Document.uri.fsPath);
  if (!await Still_Compiles (Answer + '\n', Directory))
    return { Complaint: 'The reformatted source no longer compiles, so it ' +
                        'was not applied.' };
  return { Source: Answer + '\n' };
};

const Formatting_Provider = (Root) => ({
  provideDocumentFormattingEdits: (Document, Options, Token) =>
    Reformatted (Root, Document, Token).then (({ Source, Complaint }) =>
      (Source === undefined
         ? (vscode.window.showWarningMessage (`Ada 83: ${Complaint}`), [])
         : [vscode.TextEdit.replace (Whole_Of (Document), Source)])),
});

const Reformat_Command = () =>
  vscode.commands.executeCommand ('editor.action.formatDocument');

const Opens_A_Block =
  /(?:^|\s)(?:is|then|loop|record|declare|select|begin|do|else|private|generic)\s*$/i;
const Closes_A_Block = /^\s*(?:end|elsif|else|exception|when|begin|private|or)\b/i;
const Indent_Width = 2;

const Indent_Of = (Line) => (/^\s*/.exec (Line))[0].length;

const Standing_Before = (Document, Line) =>
  ((Earlier) =>
     (Earlier.length === 0 ? null : Earlier[Earlier.length - 1]))
    (Array.from ({ length: Line }, (Ignored, Index) => Document.lineAt (Index))
          .filter (({ text }) => text.trim () !== '' &&
                                 !/^\s*--/.test (text)));

const Wanted_Indent = (Document, Line) =>
  ((Previous, Present) =>
     (Previous === null
        ? 0
        : Math.max (0, Indent_Of (Previous.text) +
                       (Opens_A_Block.test (Previous.text.replace (/--.*$/, ''))
                          ? Indent_Width : 0) -
                       (Closes_A_Block.test (Present) ? Indent_Width : 0))))
    (Standing_Before (Document, Line), Document.lineAt (Line).text);

const Reindented = (Document, Line) =>
  ((Present, Wanted) =>
     (Present.text.trim () === '' || Indent_Of (Present.text) === Wanted
        ? []
        : [vscode.TextEdit.replace (
             new vscode.Range (Line, 0, Line, Indent_Of (Present.text)),
             ' '.repeat (Wanted))]))
    (Document.lineAt (Line), Wanted_Indent (Document, Line));

const On_Type_Provider = {
  provideOnTypeFormattingEdits: (Document, Position) =>
    Configured ('formatOnType', false)
      ? Reindented (Document, Position.line)
      : [],
};

const Reformat_On_Save = (Root) => (Event) =>
  ((Document) => {
     if (!Configured ('formatOnSave', false) ||
         !Is_Ada_Document (Document)) return;
     Event.waitUntil (
       Reformatted (Root, Document, Event.token ?? undefined)
         .then (({ Source }) =>
           (Source === undefined
              ? []
              : [vscode.TextEdit.replace (Whole_Of (Document), Source)])));
   }) (Event.document);

const Reformat_Registration = (Root) =>
  vscode.lm === undefined || vscode.lm.selectChatModels === undefined
    ? []
    : [vscode.languages.registerDocumentFormattingEditProvider (
         Ada_Selector, Formatting_Provider (Root)),
       vscode.commands.registerCommand ('ada83.reformat', Reformat_Command),
       vscode.workspace.onWillSaveTextDocument (Reformat_On_Save (Root))];

const On_Type_Registration = () =>
  [vscode.languages.registerOnTypeFormattingEditProvider (
     Ada_Selector, On_Type_Provider, '\n', ';')];

const Suggestion_Scheme = 'ada83-suggestion';
const Suggestion_Sources = new Map ();
const Suggestion_Changes = new vscode.EventEmitter ();

const Suggestion_Documents = {
  onDidChange: Suggestion_Changes.event,
  provideTextDocumentContent: (Uri) =>
    Suggestion_Sources.get (Uri.toString ()) ?? '',
};

const Suggestion_Uri = (Document) =>
  Document.uri.with ({ scheme: Suggestion_Scheme });

const Complained_Of = (Diagnostics) =>
  Diagnostics
    .map (({ range, message }) =>
      `line ${range.start.line + 1}, column ${range.start.character + 1}: ` +
      message)
    .join ('\n');

const Suggestion_Instruction = (Rules, Source, Complaints) =>
  ['Repair the Ada 83 source below, which the compiler rejects with these',
   'errors:', '', Complaints, '',
   'Fix what is reported and leave the rest of the file alone. Ada 83 only,',
   'so nothing from a later Ada.',
   'Prefer the shortest form that still says what it means: one expression',
   'rather than a sequence of statements, one subprogram rather than a',
   'passage written out twice, and no scaffolding that carries no meaning.',
   'Spell every name out in full, with no abbreviations, no initials and no',
   'single letters.',
   'Comment as Knuth would: one short sentence wherever the reason for the',
   'code cannot be read off the code itself, and nowhere else. No banners,',
   'and no restatement of what the syntax already says.',
   'Follow every rule below to the letter; brevity never excuses breaking',
   'one.',
   'Answer with the repaired source alone, with no explanation and no code',
   'fence.',
   '', 'The source:', '', Source, '', 'The rules:', '', Rules].join ('\n');

const Suggested = async (Root, Document, Diagnostics, Token) => {
  const Rules = Style_Rules (Root);
  if (Rules === null)
    return { Complaint: `The style rules are in ${Manual_Name}, which is ` +
                        'not installed beside the extension.' };

  const Models = await vscode.lm.selectChatModels ({});
  if (Models.length === 0)
    return { Complaint: 'Suggesting a fix asks a language model to write ' +
                        'one, and no model is available here.' };

  const Answer = Unfenced (
    await Spoken (Models[0],
                  Suggestion_Instruction (Rules, Document.getText (),
                                          Complained_Of (Diagnostics)),
                  Token)).trim ();
  if (Answer === '')
    return { Complaint: 'The model returned nothing.' };
  if (Answer === Document.getText ().trim ())
    return { Complaint: 'The model left the source as it was.' };

  return await Still_Compiles (Answer + '\n',
                               path.dirname (Document.uri.fsPath))
    ? { Source: Answer + '\n' }
    : { Complaint: 'The suggested source does not compile either, so it ' +
                   'was not offered.' };
};

const Approved = async (Document, Source) => {
  const Uri = Suggestion_Uri (Document);
  Suggestion_Sources.set (Uri.toString (), Source);
  Suggestion_Changes.fire (Uri);
  await vscode.commands.executeCommand (
    'vscode.diff', Document.uri, Uri,
    `${path.basename (Document.uri.fsPath)}: suggested fix`);
  const Chosen = await vscode.window.showInformationMessage (
    'Ada 83: apply the suggested fix?', 'Apply', 'Discard');
  Suggestion_Sources.delete (Uri.toString ());
  return Chosen === 'Apply';
};

const Applied = (Document, Source) =>
  ((Edit) => (Edit.replace (Document.uri, Whole_Of (Document), Source),
              vscode.workspace.applyEdit (Edit)))
    (new vscode.WorkspaceEdit ());

const Is_An_Error = ({ severity }) =>
  severity === vscode.DiagnosticSeverity.Error;

const Errors_In = (Document) =>
  vscode.languages.getDiagnostics (Document.uri).filter (Is_An_Error);

const Suggest_Fix_Command = (Root) => async (Given, Reported) => {
  const Document = Given === undefined || Given.uri === undefined
    ? vscode.window.activeTextEditor?.document
    : Given;
  if (Document === undefined || !Is_Ada_Document (Document)) return;

  const Diagnostics = Reported ?? Errors_In (Document);
  if (Diagnostics.length === 0)
    return void vscode.window.showInformationMessage (
      'Ada 83: no diagnostics in this file.');

  const { Source, Complaint } = await vscode.window.withProgress (
    { location: vscode.ProgressLocation.Notification,
      title: 'Ada 83: suggesting a fix', cancellable: true },
    (Ignored, Token) => Suggested (Root, Document, Diagnostics, Token));

  if (Source === undefined)
    return void vscode.window.showWarningMessage (`Ada 83: ${Complaint}`);
  if (await Approved (Document, Source)) await Applied (Document, Source);
};

const Suggestion_Action = (Document, Diagnostics) =>
  Object.assign (
    new vscode.CodeAction ('Suggest Fix', vscode.CodeActionKind.QuickFix),
    { diagnostics: Diagnostics,
      command: { command: 'ada83.suggestFix', title: 'Suggest Fix',
                 arguments: [Document, Diagnostics] } });

const Suggestion_Provider = {
  provideCodeActions: (Document, Range, Context) =>
    ((Errors) =>
       (Errors.length === 0 ? [] : [Suggestion_Action (Document, Errors)]))
      (Context.diagnostics.filter (Is_An_Error)),
};

const Suggestion_Registration = (Root) =>
  vscode.lm === undefined || vscode.lm.selectChatModels === undefined
    ? []
    : [vscode.workspace.registerTextDocumentContentProvider (
         Suggestion_Scheme, Suggestion_Documents),
       vscode.languages.registerCodeActionsProvider (
         Ada_Selector, Suggestion_Provider,
         { providedCodeActionKinds: [vscode.CodeActionKind.QuickFix] }),
       vscode.commands.registerCommand ('ada83.suggestFix',
                                        Suggest_Fix_Command (Root))];

const Languages = [
  { Tag: 'en',     Named: 'English',              In_Words: null },
  { Tag: 'es',     Named: 'Spanish',              In_Words: 'Spanish' },
  { Tag: 'fr',     Named: 'French',               In_Words: 'French' },
  { Tag: 'de',     Named: 'German',               In_Words: 'German' },
  { Tag: 'zh-CN',  Named: 'Chinese (Simplified)',
    In_Words: 'Simplified Chinese' },
  { Tag: 'ja',     Named: 'Japanese',             In_Words: 'Japanese' },
  { Tag: 'hi',     Named: 'Hindi',                In_Words: 'Hindi' },
  { Tag: 'lolcat', Named: 'Lolcat',
    In_Words: 'Lolcat: the deliberately misspelled cat speak of the ' +
              'I-CAN-HAS-CHEEZBURGER captions. Upper case throughout, and ' +
              'the idiom of CAN HAS, OH NOES, IS NOT, INVISIBLE, SRSLY and ' +
              'KTHXBAI. Keep it short and keep the meaning' },
];

const Language_Table = new Map (Languages.map ((L) => [L.Tag, L]));

const Language_Spoken = () =>
  Language_Table.get (Configured ('language', 'en')) ?? Language_Table.get ('en');

const Code_Span = /'[^'\n]*'|`[^`\n]*`|"[^"\n]*"/g;

const Masked = (Message) => {
  const Kept = [];
  const Skeleton = Message.replace (Code_Span,
    (Span) => (Kept.push (Span), `{${Kept.length - 1}}`));
  return { Skeleton, Kept };
};

const Unmasked = (Skeleton, Kept) =>
  Skeleton.replace (/\{(\d+)\}/g,
                    (Whole, Index) => Kept[Number (Index)] ?? Whole);

const Translation_Instruction = (In_Words, Skeletons) =>
  ['Translate each numbered line below into ' + In_Words + '.',
   'They are diagnostics from a compiler for the Ada 83 language.',
   'A run like {0} or {3} stands for a piece of the programmer\'s own source',
   'that has been taken out. Reproduce every placeholder exactly as it is,',
   'once each and in the order it appears, and translate only the words',
   'around it. Do not translate, quote or explain a placeholder.',
   'Leave any Ada reserved word you have to name in English.',
   'Answer with exactly one line per input, each written as the number, a',
   'full stop, a space, and the translation. Write nothing else.',
   '',
   ...Skeletons.map ((Skeleton, At) => `${At + 1}. ${Skeleton}`)].join ('\n');

const Numbered_Lines = (Reply) =>
  Reply.split ('\n')
       .map ((Line) => /^\s*(\d+)\s*[.)]\s*(.*)$/.exec (Line))
       .filter ((Match) => Match !== null)
       .reduce ((Out, Match) => (Out[Number (Match[1]) - 1] = Match[2].trim (),
                                 Out),
                []);

const Translations = new Map ();

const Remembered = (Tag, Message) => `${Tag}\n${Message}`;

const Translated = async (Language, Messages) => {
  const Wanted = Array.from (new Set (Messages)).filter (
    (Message) => !Translations.has (Remembered (Language.Tag, Message)));

  if (Wanted.length > 0) {
    const Models = await vscode.lm.selectChatModels ({});
    if (Models.length === 0) return Messages;

    const Prepared = Wanted.map (Masked);
    const Lines = Numbered_Lines (await Spoken (
      Models[0],
      Translation_Instruction (Language.In_Words,
                               Prepared.map (({ Skeleton }) => Skeleton)),
      undefined));

    Prepared.forEach (({ Kept }, At) => {
      if (typeof Lines[At] === 'string' && Lines[At] !== '')
        Translations.set (Remembered (Language.Tag, Wanted[At]),
                          Unmasked (Lines[At], Kept));
    });
  }

  return Messages.map ((Message) =>
    Translations.get (Remembered (Language.Tag, Message)) ?? Message);
};

const Messages_In = (Diagnostics) =>
  Diagnostics.flatMap ((Reported) =>
    [Reported.message,
     ...(Reported.relatedInformation ?? []).map (({ message }) => message)]);

const Retold = (Diagnostics, Spoken_Messages) => {
  let At = 0;
  return Diagnostics.map ((Reported) =>
    Object.assign (
      new vscode.Diagnostic (Reported.range, Spoken_Messages[At++],
                             Reported.severity),
      { source: Reported.source,
        code: Reported.code,
        relatedInformation: (Reported.relatedInformation ?? []).map (
          (Related) => new vscode.DiagnosticRelatedInformation (
                         Related.location, Spoken_Messages[At++])) }));
};

const Localised = async (Language, Uri, Diagnostics, Held) => {
  const Spoken_Messages = await Translated (Language, Messages_In (Diagnostics));
  if (Session === Held)
    Session.Diagnostics.set (Uri, Retold (Diagnostics, Spoken_Messages));
};

const Publish = ({ Uri, Diagnostics }) => {
  Session.Diagnostics.set (Uri, Diagnostics);
  const Language = Language_Spoken ();
  if (Language.In_Words === null || Diagnostics.length === 0 ||
      vscode.lm === undefined || vscode.lm.selectChatModels === undefined)
    return;
  Localised (Language, Uri, Diagnostics, Session).catch (() => { });
};

const Ada_Selector = { scheme: 'file', language: 'ada83' };

const Project_Suffixes = ['.gpr', '.gpj'];

const Is_A_Project = (Named) =>
  Project_Suffixes.includes (path.extname (Named).toLowerCase ());

const Beside_The_Folder = (Named) =>
  ((Folder) =>
     (path.isAbsolute (Named) || Folder === null
        ? Named
        : path.join (Folder.uri.fsPath, Named)))
    (Opened_Folder ());

const Named_Project = () =>
  ((Named) => (Named === '' ? null : Beside_The_Folder (Named)))
    (Substituted (Configured ('projectFile', '')).trim ());

const Root_Projects = () => {
  const Folder = Opened_Folder ();
  try {
    return Folder === null
      ? []
      : fs.readdirSync (Folder.uri.fsPath)
           .filter (Is_A_Project)
           .sort ()
           .map ((Named) => path.join (Folder.uri.fsPath, Named));
  } catch { return []; }
};

const Active_Project = () =>
  Named_Project () ??
  ((Found) => (Found.length === 1 ? Found[0] : null)) (Root_Projects ());

const Scenario = () => Configured ('scenario', {});

const Scenario_Arguments = () =>
  Object.entries (Scenario ()).map (([Name, Value]) => `-X${Name}=${Value}`);

const Extension_Arguments = () =>
  (Configured ('languageExtensions', true) ? [] : ['-ada83']);

const Project_Arguments = (Project, Rest) =>
  ['-P', Project, ...Extension_Arguments (), ...Scenario_Arguments (), ...Rest];

const Ran = (Arguments, Environment) =>
  new Promise ((Resolve) => {
    const [Command, Given, Options] =
      Host_Escaped (Compiler_Path (), Arguments, Environment);
    const Child = spawn (Command, Given, Options);
    let Answer = '', Complaint = '';
    Child.stdout.on ('data', (Chunk) => { Answer += Chunk; });
    Child.stderr.on ('data', (Chunk) => { Complaint += Chunk; });
    Child.on ('error', ({ message }) =>
      Resolve ({ Code: -1, Answer, Complaint: message }));
    Child.on ('close', (Code) => Resolve ({ Code, Answer, Complaint }));
  });

const Plan_Value_Column = 41;
const Project_Heading   = /^project (\S.*)$/;

const Recorded = (Values, Key, Value) =>
  Values.set (Key, [...(Values.get (Key) ?? []), Value]);

const Plan_Of = (Text) => {
  const Read   = { Projects: [], Whole: new Map () };
  const Latest = () => Read.Projects[Read.Projects.length - 1];
  let   Filed  = Read.Whole;
  let   Key    = '';
  Text.split (/\r?\n/).forEach ((Line) => {
    const Opened = Project_Heading.exec (Line);
    if (Opened !== null) {
      Read.Projects.push ({ Name: Opened[1].trim (), Values: new Map () });
      Filed = Latest ().Values;
      Key = '';
      return;
    }
    if (Read.Projects.length === 0 || Line.length <= Plan_Value_Column) return;
    const Named = Line.slice (0, Plan_Value_Column).trim ();
    if (Named !== '') {
      Key   = Named;
      Filed = Line.startsWith (' ') ? Latest ().Values : Read.Whole;
    }
    if (Key !== '')
      Recorded (Filed, Key, Line.slice (Plan_Value_Column).trim ());
  });
  return Read;
};

let Project_Plan = null;

const Everywhere = (Key) =>
  Project_Plan === null
    ? []
    : [...new Set (Project_Plan.Projects.flatMap (
         ({ Values }) => Values.get (Key) ?? []))];

const In_The_Root = (Key) =>
  Project_Plan === null || Project_Plan.Projects.length === 0
    ? [] : Project_Plan.Projects[0].Values.get (Key) ?? [];

const Top_Level = (Key) =>
  Project_Plan === null ? [] : Project_Plan.Whole.get (Key) ?? [];

const Indexed_In_The_Root = (Name, Index) =>
  Project_Plan === null || Project_Plan.Projects.length === 0
    ? []
    : [...Project_Plan.Projects[0].Values]
        .filter (([Key]) =>
           Key.toLowerCase () === `${Name} ("${Index}")`.toLowerCase ())
        .flatMap (([, Items]) => Items);

const Language_Source_Keys = [
  { Language: 'Ada',   Keys: ['Ada_Sources', 'Source_Files'], Tagged: false },
  { Language: 'C',     Keys: ['C_Sources'],                   Tagged: false },
  { Language: 'C++',   Keys: ['CPP_Sources'],                 Tagged: false },
  { Language: 'Other', Keys: ['Other_Sources'],               Tagged: true },
];

const Tagged_Source = /^(.*\S)\s+\[(.+)\]$/;

const Source_Row_Of = (Tagged) => (Text) =>
  ((Match) =>
     (Match === null ? { Path: Text, Tag: null }
                     : { Path: Match[1], Tag: Match[2] }))
    (Tagged ? Tagged_Source.exec (Text) : null);

const First_Listed = (Values_Named, Keys) =>
  Keys.map ((Key) => Values_Named (Key))
      .find ((Items) => Items.length > 0) ?? [];

const Language_Groups = (Values_Named) =>
  ((Groups) =>
     (Groups.every (({ Language, Sources }) =>
        Language === 'Ada' || Sources.length === 0)
        ? null
        : Groups.filter (({ Sources }) => Sources.length > 0)))
    (Language_Source_Keys.map (({ Language, Keys, Tagged }) =>
       ({ Language,
          Sources: First_Listed (Values_Named, Keys)
                     .map (Source_Row_Of (Tagged)) })));

const Complaint_Pattern =
  /^(.*?):(\d+):(\d+):\s+(error|warning|note|internal error):\s+(.*)$/;

const Project_Severity_Table = {
  error: vscode.DiagnosticSeverity.Error,
  warning: vscode.DiagnosticSeverity.Warning,
  note: vscode.DiagnosticSeverity.Information,
  'internal error': vscode.DiagnosticSeverity.Error,
};

const Project_Severity_Of =
  Mapped (Project_Severity_Table, vscode.DiagnosticSeverity.Error);

const Complaint_Of = (Row, Column, Severity, Message) =>
  Object.assign (
    new vscode.Diagnostic (
      new vscode.Range (Number (Row) - 1, Number (Column) - 1,
                        Number (Row) - 1, Number.MAX_SAFE_INTEGER),
      Message, Project_Severity_Of (Severity)),
    { source: 'ada83' });

const Complained_About = (Complaints, Text) => {
  const Found = new Map ();
  Text.split (/\r?\n/).forEach ((Line) =>
    ((Match) => {
       if (Match === null) return;
       const [, File, Row, Column, Severity, Message] = Match;
       Recorded (Found, File,
                 Complaint_Of (Row, Column, Severity, Message));
     }) (Complaint_Pattern.exec (Line)));
  Complaints.clear ();
  Found.forEach ((Diagnostics, File) =>
    Complaints.set (vscode.Uri.file (Beside_The_Folder (File)), Diagnostics));
};

let Project_Item = null;

const Scenario_Summary = () =>
  ((Set) =>
     (Set.length === 0 ? ''
      : Set.length === 1 ? ` ${Set[0][0]}=${Set[0][1]}`
      : ` ${Set.length} set`))
    (Object.entries (Scenario ()));

const Details_Spellings =
  ['VCS_Kind', 'Documentation_Dir', 'Gnat', 'Gnatlist', 'VCS_File_Check',
   'VCS_Log_Check', 'Remote_Host', 'Program_Host', 'Communication_Protocol',
   'Xref_Database_Dir', 'Artifacts_Dir'];

const Project_Details = () =>
  Details_Spellings.flatMap ((Name) =>
    In_The_Root (`IDE'${Name}`).map ((Value) => `${Name} = ${Value}`));

const Project_Tooltip = (Project) =>
  [`Project: ${Project}`,
   Project_Plan === null
     ? 'The compiler would not read it; see the Problems panel.'
     : `Mains: ${In_The_Root ('Main').join (', ') || 'none declared'}`,
   ...Project_Details (),
   ...Object.entries (Scenario ())
      .map (([Name, Value]) => `${Name} = ${Value}`),
   'Click to set a scenario variable.'].join ('\n');

const Show_Project = () => {
  if (Project_Item === null) return;
  const Project = Active_Project ();
  const Several = Project === null && Root_Projects ().length > 1;
  if (Project === null && !Several) return Project_Item.hide ();
  Project_Item.text = Project === null
    ? '$(list-tree) choose a project'
    : `${Project_Plan === null ? '$(error)' : '$(list-tree)'} ` +
      `${path.basename (Project)}${Scenario_Summary ()}`;
  Project_Item.command =
    Project === null ? 'ada83.selectProject' : 'ada83.setScenario';
  Project_Item.tooltip = Project === null
    ? 'Ada 83: the workspace root holds more than one project file, so ' +
      'none is active. Click to choose one.'
    : Project_Tooltip (Project);
  Project_Item.show ();
};

const Project_Refresh = async (Complaints) => {
  const Project = Active_Project ();
  Project_Plan = null;
  vscode.commands.executeCommand ('setContext', 'ada83.hasProject',
                                  Project !== null);
  Complaints.clear ();
  if (Project !== null) {
    const Reply = await Ran (Project_Arguments (Project, ['-n']));
    Complained_About (Complaints, Reply.Complaint);
    if (Reply.Code === 0) Project_Plan = Plan_Of (Reply.Answer);
  }
  Show_Project ();
};

const Externals_Argument = '--externals';

const Variable_Of = (Reported) => ({
  Name:    String (Reported.name ?? ''),
  Type:    Reported.type ?? null,
  Values:  Array.isArray (Reported.values) ? Reported.values.map (String) : [],
  Default: Reported.default ?? null,
  Value:   Reported.value ?? null,
});

const Listed_Variables = async (Project) =>
  ((Reply) => {
     if (Reply.Code !== 0) return null;
     try {
       const Reported = JSON.parse (Reply.Answer);
       return Array.isArray (Reported) ? Reported.map (Variable_Of) : null;
     } catch { return null; }

    return void vscode.window.showInformationMessage (
      'Ada 83: cannot clean. No project has been read.');

  const Executables = In_The_Root ('Exec_Dir');
  if (Objects.length === 0 && Executables.length === 0)
    return void vscode.window.showInformationMessage (
      'Ada 83: cannot clean. The project sets no Object_Dir or Exec_Dir.');
  const Chosen = await vscode.window.showWarningMessage (
    `Ada 83: remove the compiler's own products from ` +
    `${[...Objects, ...Executables].join (', ')}?`,
    { modal: true }, 'Remove');
  if (Chosen !== 'Remove') return;
  const Gone =
    [...Objects.flatMap (Products_In),
     ...Executables.flatMap (Executables_In)].reduce (
       (Total, Given) => Total + Removed (Given), 0);
  vscode.window.showInformationMessage (
    `Ada 83: removed ${Gone} file${Gone === 1 ? '' : 's'}.`);
};

const Presentation = {
  starting: ['$(loading~spin)', 'starting'],
  ready: ['$(check)', 'ready'],
  restarting: ['$(sync~spin)', 'restarting'],
  failed: ['$(error)', 'unavailable'],
  stopped: ['$(circle-slash)', 'stopped'],
};

const Show_State = (Status, State) => {
  const [Icon, Detail] = Presentation[State];
  Status.text = `${Icon} Ada 83`;
  Status.tooltip = `Ada 83 language server: ${Detail}`;
  Status.show ();
};

const Restart_Delay = (Attempt) => Math.min (1000 * 2 ** Attempt, 30000);
const Restart_Limit = 5;

const Start = (Diagnostics, Output, Status, Attempt) => {
  if (!Configured ('enable', true)) return Show_State (Status, 'stopped');

  const Path = Compiler_Path ();
  const [Command, Arguments] =
    Host_Escaped (Path, ['--lsp', ...Extension_Arguments (),
                         ...Include_Arguments ()]);
  const Server = spawn (Command, Arguments, { stdio: 'pipe' });
  const Ours = { Server, Diagnostics, Output, Status, Buffered: '',
                 Ready: false, Capabilities: {}, Registered: [] };
  Session = Ours;
  Show_State (Status, Attempt === 0 ? 'starting' : 'restarting');

  const Give_Up = (Reason) => {
    if (Session !== Ours) return;
    Session = null;
    Abandon_All ();
    Ours.Registered.forEach ((Registration) => Registration.dispose ());
    if (Attempt >= Restart_Limit) {
      Show_State (Status, 'failed');
      Output.appendLine (`server unavailable: ${Reason}`);
      return vscode.window.showErrorMessage (
        `Ada 83: '${Path} --lsp' failed (${Reason}). Check ` +
        'ada83.compilerPath and ada83-runtime.ada.');
    }
    Show_State (Status, 'restarting');
    Output.appendLine (`server ${Reason}; restarting`);
    setTimeout (() => {
      if (Session === null)
        Start (Diagnostics, Output, Status, Attempt + 1);
    }, Restart_Delay (Attempt));
  };

  Server.on ('error', (Reason) => Give_Up (Reason.message));
  Server.on ('exit', (Code, Signal) =>
    Give_Up (`exited with ${Signal ?? Code}`));
  Server.stdout.setEncoding ('utf8');
  Server.stdout.on ('data', (Chunk) => {
    if (Session === Ours) Receive (Chunk);
  });
  Server.stderr.setEncoding ('utf8');
  Server.stderr.on ('data', (Text) => Output.append (Text));

  Ask (Initialize).then ((Result) => {
    if (Session !== Ours) return;
    if (Result === null) return void Server.kill ();
    Ours.Ready = true;
    Ours.Capabilities = Result.capabilities ?? {};
    Ours.Registered = Registrations (Ours.Capabilities);
    Show_State (Status, 'ready');
    Send (Initialized ());
    vscode.workspace.textDocuments
      .filter (Is_Ada_Document)
      .map (Did_Open)
      .forEach (Send);
  });
};

const Stop = () => {
  if (Session === null) return;
  const Ending = Session;
  [Shutdown (Next_Id++), Exit ()].forEach (Send);
  Session = null;
  Abandon_All ();
  Ending.Registered.forEach ((Registration) => Registration.dispose ());
  Ending.Diagnostics.clear ();
  Ending.Server.kill ();
};

const Restart = (Diagnostics, Output, Status) => {
  Stop ();
  Start (Diagnostics, Output, Status, 0);
};

const Progress_Line = /^PROGRESS (\d+) (\d+) (\S+) (.*)$/;

const Progress_Build = (Project, Mains, Output, Debug) =>
  vscode.window.withProgress (
    { location: vscode.ProgressLocation.Notification,
      title: 'Ada 83: building', cancellable: true },
    (Progress, Token) => new Promise ((Resolve) => {
      const [Command, Given, Options] = Host_Escaped (
        Compiler_Path (),
        Project_Arguments (Project, ['--progress',
                                     ...(Debug === true ? ['-g'] : []),
                                     ...Mains]));
      const Child = spawn (Command, Given, Options);
      let Compiled = 0;
      let Buffered = '';
      Token.onCancellationRequested (() => Child.kill ());
      Child.stdout.setEncoding ('utf8');
      Child.stdout.on ('data', (Chunk) => {
        Buffered += Chunk;
        const Lines = Buffered.split ('\n');
        Buffered = Lines.pop ();
        Lines.map ((Line) => Progress_Line.exec (Line))
             .filter ((Match) => Match !== null)
             .forEach (([, N, Total, Unit, File]) => {
                Compiled = Number (N);
                Progress.report ({
                  increment: 100 / Number (Total),
                  message: `compiling ${N}/${Total} — ` +
                           `${path.basename (File)}`,
                });
              });
      });
      Child.stderr.setEncoding ('utf8');
      Child.stderr.on ('data', (Text) => Output.append (Text));
      Child.on ('error', ({ message }) => {
        Output.appendLine (message);
        Resolve ({ Code: -1, Compiled });
      });
      Child.on ('close', (Code) => Resolve ({ Code, Compiled }));
    }));

const Told_The_Outcome = ({ Code, Compiled }, Output) =>
  Code !== 0
    ? vscode.window.showWarningMessage (
        'Ada 83: the build failed. See the Ada 83 output.', 'Show Output')
        .then ((Chosen) => { if (Chosen === 'Show Output') Output.show (true); })
    : Compiled === 0
      ? vscode.window.showInformationMessage (
          'Ada 83: up to date.')
      : vscode.window.showInformationMessage (
          `Ada 83: built — ${Compiled} unit${Compiled === 1 ? '' : 's'} ` +
          'compiled.');

const Sidebar_Build = (Memory, Clean, Output) => async (Element, Debug) => {
  const Project = Active_Project ();
  if (Project === null) return Select_Project ();
  if (!await Cleared_First (Memory, Clean)) return null;
  await Memory.update (Built_With, Stamp_Of ());
  const Outcome = await Progress_Build (
    Project, Element?.Main === undefined ? [] : [Element.Main], Output,
    Debug);
  void Told_The_Outcome (Outcome, Output);
  return Outcome;
};

const Sidebar_Attribute_Values = (Given, Name, Index) =>

const Sidebar_Executable = (Given, Main) =>

       ? null

    (Sidebar_Attribute_Values (Given, 'Exec_Dir')[0]);

const Sidebar_Run = (Memory, Clean, Output) => async (Element) => {
  if (Element?.Main === undefined) return;
  const Outcome = await Sidebar_Build (Memory, Clean, Output) (Element);
  if (Outcome === null || Outcome === undefined || Outcome.Code !== 0)
    return;
  const Executable = Sidebar_Executable (Element.Given, Element.Main);

const Version_Of = (Command) =>
  new Promise ((Resolve) => {
    const [Spawned, Arguments, Options] =
      Host_Escaped (Command, ['--version']);
    let Child;
    try { Child = spawn (Spawned, Arguments, Options); }
    catch { return Resolve (null); }
    let Answer = '';
    Child.stdout.on ('data', (Chunk) => { Answer += Chunk; });
    Child.on ('error', () => Resolve (null));
    Child.on ('close', (Code) =>
      Resolve (Code === 0 && Answer.trim () !== ''
                 ? Answer.trim ().split (/\r?\n/)[0]
                 : null));
  });

const Setting_Written = () =>

const Terminals_Told = (Context, Executable) => {

};

const Adopted = async (Context, Executable, Version, Target) => {
  Known_Compiler = { Path: Executable, Version };

      Substituted (Configured ('compilerPath', 'ada83')) !== Executable)

const Default_Download_Base =
  'https://raw.githubusercontent.com/AdaDoom3/Ada83/main';

const Download_Base = () =>
  Configured ('downloadBase', Default_Download_Base).replace (/\/+$/, '');

const Fetched_Names = () =>
  process.platform === 'win32'
    ? [`${Platform_Folder}/ada83.exe`, 'ada83-runtime.ada', 'bin-libraries.zip']
    : [`${Platform_Folder}/ada83`, 'ada83-runtime.ada'];

const Got = (Address, Redirects) =>
  new Promise ((Resolve, Reject) => {
    const Where = new URL (Address);
    if (Where.protocol === 'file:')
      return fs.readFile (fileURLToPath (Where), (Complaint, Data) =>
        (Complaint ? Reject (Complaint) : Resolve (Data)));
    const Transport = Where.protocol === 'http:' ? http : https;
    const Request = Transport.get (Where, (Reply) => {
      if (Reply.statusCode >= 300 && Reply.statusCode < 400 &&
          Reply.headers.location !== undefined) {
        Reply.resume ();
        return (Redirects ?? 0) >= 5
          ? Reject (new Error (`too many redirects for ${Address}`))
          : Resolve (Got (new URL (Reply.headers.location, Where).toString (),
                          (Redirects ?? 0) + 1));
      }
      if (Reply.statusCode !== 200) {
        Reply.resume ();
        return Reject (new Error (`${Reply.statusCode} for ${Address}`));
      }
      const Pieces = [];
      Reply.on ('data', (Piece) => Pieces.push (Piece));
      Reply.on ('end', () => Resolve (Buffer.concat (Pieces)));
      Reply.on ('error', Reject);
    });
    Request.on ('error', Reject);
    Request.setTimeout (120000, () =>
      Request.destroy (new Error (`timed out fetching ${Address}`)));
  });

const Zip_Members = (Data) => {
  let At = Data.length - 22;
  while (At >= 0 && Data.readUInt32LE (At) !== 0x06054b50) At--;
  if (At < 0) throw new Error ('not a zip file');
  const Count = Data.readUInt16LE (At + 10);
  let Entry = Data.readUInt32LE (At + 16);
  const Members = [];
  for (let Index = 0; Index < Count; Index++) {
    if (Data.readUInt32LE (Entry) !== 0x02014b50)
      throw new Error ('damaged zip directory');
    const Method = Data.readUInt16LE (Entry + 10);
    const Squeezed = Data.readUInt32LE (Entry + 20);
    const Name_Length = Data.readUInt16LE (Entry + 28);
    const Extra_Length = Data.readUInt16LE (Entry + 30);
    const Comment_Length = Data.readUInt16LE (Entry + 32);
    const Local = Data.readUInt32LE (Entry + 42);
    const Start = Local + 30 + Data.readUInt16LE (Local + 26) +
                  Data.readUInt16LE (Local + 28);
    Members.push ({
      Name: Data.slice (Entry + 46, Entry + 46 + Name_Length)
                .toString ('utf8'),
      Method,
      Data: Data.slice (Start, Start + Squeezed),
    });
    Entry += 46 + Name_Length + Extra_Length + Comment_Length;
  }
  return Members;
};

const Unpacked = (Member) =>
  Member.Method === 0 ? Member.Data :
  Member.Method === 8 ? zlib.inflateRawSync (Member.Data) :
  (() => { throw new Error (`zip method ${Member.Method}`); }) ();

const Downloaded_Compiler = async (Context) => {
  const Home = path.join (Context.globalStorageUri.fsPath,
                          Context.extension?.packageJSON?.version ?? '0');
  const Staging = Home + '.partial';
  fs.rmSync (Staging, { recursive: true, force: true });
  fs.mkdirSync (Staging, { recursive: true });
  try {
    for (const Name of Fetched_Names ()) {
      const Data = await Got (`${Download_Base ()}/${Name}`);
      if (Name === 'bin-libraries.zip')
        Zip_Members (Data)
          .filter ((Member) => Member.Name.toLowerCase ().endsWith ('.dll'))
          .forEach ((Member) =>
            fs.writeFileSync (
              path.join (Staging, path.basename (Member.Name)),
              Unpacked (Member)));
      else
        fs.writeFileSync (path.join (Staging, path.basename (Name)), Data);
    }
    fs.chmodSync (path.join (Staging, 'ada83' + Executable_Suffix), 0o755);
    const Version =
      await Version_Of (path.join (Staging, 'ada83' + Executable_Suffix));
    if (Version === null)
      throw new Error ('the downloaded compiler does not answer --version');
    fs.rmSync (Home, { recursive: true, force: true });
    fs.renameSync (Staging, Home);
    return { Executable: path.join (Home, 'ada83' + Executable_Suffix),
             Version };
  } catch (Reason) {
    fs.rmSync (Staging, { recursive: true, force: true });
    throw Reason;
  }
};

const Fetch_Compiler = (Context) =>
  vscode.window.withProgress (
    { location: vscode.ProgressLocation.Notification,
      title: 'Ada 83: downloading the compiler' },

  .then (async ({ Executable, Version }) => {
    await Adopted (Context, Executable, Version,
                   vscode.ConfigurationTarget.Global);
    vscode.window.showInformationMessage (
      `Ada 83: installed ${Version}.`);
  })
  .catch ((Reason) =>
    vscode.window.showErrorMessage (
      `Ada 83: download failed (${Reason.message}). Set ` +
      'ada83.downloadBase, or locate a compiler.'));

const Locate_Compiler = async (Context) => {
  const Chosen = await vscode.window.showOpenDialog (
    { canSelectMany: false, openLabel: 'Select Compiler',
      title: 'Locate ada83' });
  if (Chosen === undefined || Chosen.length === 0) return;
  const Executable = Chosen[0].fsPath;
  const Version = await Version_Of (Executable);
  if (Version === null)
    return void vscode.window.showErrorMessage (
      `Ada 83: '${Executable}' does not answer --version, so it was not ` +
      'taken. Remember the compiler needs ada83-runtime.ada beside it ' +
      'to compile anything.');
  await Adopted (Context, Executable, Version,
                 vscode.ConfigurationTarget.Global);
};

const Offer_Compiler = (Context) =>
  vscode.window.showInformationMessage (
    'Ada 83: no compiler found in ada83.compilerPath, the workspace, ' +
    'or PATH. Language features need one.',
    'Download', 'Locate…', 'Not Now')
  .then ((Chosen) =>
    Chosen === 'Download' ? Fetch_Compiler (Context)
    : Chosen === 'Locate…' ? Locate_Compiler (Context)
    : undefined);

const Compiler_Settled = async (Context) => {
  if (Setting_Written ()) {
    const Named = Compiler_Path ();
    const Version = await Version_Of (Named);
    if (Version !== null) return Adopted (Context, Named, Version);
  }
  const Local = Workspace_Compiler ();
  if (Local !== null && fs.existsSync (Local)) {
    const Version = await Version_Of (Local);
    if (Version !== null)
      return Adopted (Context, Local, Version, Scenario_Target ());
  }
  const On_Path = await Version_Of ('ada83' + Executable_Suffix);
  if (On_Path !== null)
    return Adopted (Context, 'ada83' + Executable_Suffix, On_Path);
  Known_Compiler = { Path: null, Version: null };
  Terminals_Told (Context, null);
  Show_Compiler ();
  Offer_Compiler (Context);
};

const Ada_Identifier = /^[A-Za-z](_?[A-Za-z0-9])*$/;

const Scaffold_Project = (Name, Kind) => [
  `--  Written by Ada 83: New Project.  Build it with`,
  `--    ada83 -P ${Name.toLowerCase ()}.gpr [-X BUILD=release]`,
  `project ${Name} is`,

const Asked_Name = () =>

    title: 'New Project: Name (2/2)',
    prompt: 'Enter the project name; its lower case names the folder.',
    validateInput: (Given) =>
      Ada_Identifier.test (Given.trim ())

  vscode.window.showSaveDialog ({
    title: 'New Project: Location (2/2)',
    saveLabel: 'Create Project',
    defaultUri: Start ?? vscode.Uri.file (path.join (os.homedir (), '.gpr')),
    filters: { 'GPR project file': ['gpr'] },
  });

const New_Project = (Context) => async () => {
  const Kind = await Asked_Kind ();
  if (Kind === undefined) return;

  const Folder = Opened_Folder ();
  let Name, Parent;
  if (Folder === null) {
    for (let Start;;) {
      const Chosen = await Asked_Location (Start);
      if (Chosen === undefined) return;
      Name   = path.basename (Chosen.fsPath).replace (/\.gpr$/i, '');
      Parent = path.dirname (Chosen.fsPath);
      if (Ada_Identifier.test (Name)) break;
      Start = vscode.Uri.file (path.join (Parent, '.gpr'));
      await vscode.window.showErrorMessage (
        Name === ''
          ? 'Ada 83: the project needs a name before the .gpr.'
          : `Ada 83: '${Name}' is not an Ada identifier, so it cannot ` +
            'name a project.',
        { modal: true });
    }
  } else {
    const Given = await Asked_Name ();
    if (Given === undefined) return;
    Name   = Given.trim ();
    Parent = Folder.uri.fsPath;
  }

  const Lower = Name.toLowerCase ();
  const Root  = vscode.Uri.file (path.join (Parent, Lower));
  const Under = (...Steps) => vscode.Uri.joinPath (Root, ...Steps);
  try {
    await vscode.workspace.fs.stat (Root);
    return void vscode.window.showErrorMessage (
      `Ada 83: '${Root.fsPath}' already exists.`);
  } catch {}

  const First = Kind === 'application' ? Under ('src', 'main.adb')
                                       : Under ('src', `${Lower}.ads`);
  const Written = new vscode.WorkspaceEdit ();
  const Filed = (Where, Text) =>
    Written.createFile (Where, { contents: Buffer.from (Text) });
  Filed (Under (`${Lower}.gpr`), Scaffold_Project (Name, Kind));
  if (Kind === 'application')
    Filed (First, Scaffold_Main (Name));
  else {
    Filed (First, Scaffold_Spec (Name));
    Filed (Under ('src', `${Lower}.adb`), Scaffold_Body (Name));
  }
  try {
    await vscode.workspace.fs.createDirectory (Under ('src'));
    if (!await vscode.workspace.applyEdit (Written)) throw new Error ();
  } catch ({ message }) {
    return void vscode.window.showErrorMessage (
      `Ada 83: the project could not be written` +
      `${message ? ` (${message})` : ''}.`);
  }

  if (Folder === null)
    return void vscode.commands.executeCommand ('vscode.openFolder', Root);

  await Settled ('projectFile',
                 vscode.workspace.asRelativePath (Under (`${Lower}.gpr`)));
  await vscode.window.showTextDocument (
    await vscode.workspace.openTextDocument (First));
  if (Known_Compiler.Version === null) Offer_Compiler (Context);
};

const Debug_Type = 'ada83';
const Debug_Prebuilt = 'ada83Prebuilt';
const Debug_Flag = /(^|\s)--dap\b/;

const Usage_Of = (Command) =>
  new Promise ((Resolve) => {
    const [Spawned, Arguments, Options] = Host_Escaped (Command, ['--help']);
    let Child;
    try { Child = spawn (Spawned, Arguments, Options); }
    catch { return Resolve (''); }
    let Told = '';
    Child.stdout.on ('data', (Chunk) => { Told += Chunk; });
    Child.stderr.on ('data', (Chunk) => { Told += Chunk; });
    Child.on ('error', () => Resolve (''));
    Child.on ('close', () => Resolve (Told));
  });

const Usage_Answers = new Map ();

const Speaks_Dap = (Compiler) => {
  if (!Usage_Answers.has (Compiler))
    Usage_Answers.set (Compiler,
      Usage_Of (Compiler).then ((Told) => Debug_Flag.test (Told)));
  return Usage_Answers.get (Compiler);
};

const Adapter_Executable = (Command, Arguments) =>
  ((Escaped) => new vscode.DebugAdapterExecutable (Escaped[0], Escaped[1]))
    (Host_Escaped (Command, Arguments));

const Command_Piece  = /(?:[^\s"']|"[^"]*"|'[^']*')+/g;
const Command_Quotes = /"([^"]*)"|'([^']*)'/g;

const Command_Words = (Text) =>
  (Text.match (Command_Piece) ?? []).map ((Word) =>
    Word.replace (Command_Quotes, (Whole, Double, Single) => Double ?? Single));

const Debugger_Command = () =>
  ((Words) => (Words.length === 0 ? null : Words))
    (Command_Words (In_The_Root ("IDE'Debugger_Command")[0] ?? ''));

const Debug_Adapter_Factory = {
  createDebugAdapterDescriptor: async () => {
    const Named = Substituted (Configured ('debugAdapterPath', '')).trim ();
    if (Named !== '') return Adapter_Executable (Named, []);
    const Commanded = Debugger_Command ();
    if (Commanded !== null)
      return Adapter_Executable (Commanded[0], Commanded.slice (1));
    const Compiler =
      Pinned_Compiler () ?? Known_Compiler.Path ?? Compiler_Path ();
    if (!await Speaks_Dap (Compiler))
      throw new Error (
        `Ada 83: '${Compiler}' does not know --dap, the mode where the ` +
        'compiler itself is the debug adapter. Run Ada 83: Download Or ' +
        'Update The Compiler, or point ada83.debugAdapterPath at a DAP ' +
        'executable.');
    return Adapter_Executable (Compiler, ['--dap']);
  },
};

const Debug_Mains = () =>
  ((Root) =>
     Root === undefined
       ? []
       : Sidebar_Attribute_Values (Root, 'Main')
           .map ((Main) => ({ Main, Given: Root })))
    (Sidebar_Model?.Plan?.projects[0]);

const Debug_Configuration = (Element, Executable) => ({
  type: Debug_Type,
  request: 'launch',
  name: `Ada 83: ${Element.Main}`,
  program: Executable,
});

const Debug_Built = (Memory, Output) => async (Element) => {
  const Outcome =
    await Sidebar_Build (Memory, Clean_Project, Output) (Element, true);
  if (Outcome === null || Outcome === undefined || Outcome.Code !== 0)
    return null;
  const Executable = Sidebar_Executable (Element.Given, Element.Main);
  if (Executable !== null) return Debug_Configuration (Element, Executable);
  vscode.window.showInformationMessage (
    'Ada 83: cannot debug. The project names no Exec_Dir.');
  return null;
};

const Debug_Chosen = async (Mains) =>
  ((Picked) => Mains.find (({ Main }) => Main === Picked))
    (await vscode.window.showQuickPick (
       Mains.map (({ Main }) => Main),
       { title: 'Debug Main' }));

const Debug_Main = (Memory, Output) => async (Given) => {
  if (Active_Project () === null) return Select_Project ();
  const Mains = Debug_Mains ();
  if (Given?.Main === undefined && Mains.length === 0)
    return void vscode.window.showInformationMessage (
      'Ada 83: cannot debug. The project declares no Main.');
  const Element = Given?.Main !== undefined ? Given
                : Mains.length === 1 ? Mains[0]
                : await Debug_Chosen (Mains);
  if (Element === undefined) return;
  const Configuration = await Debug_Built (Memory, Output) (Element);
  if (Configuration !== null)
    vscode.debug.startDebugging (
      Opened_Folder () ?? undefined,
      { ...Configuration, [Debug_Prebuilt]: true });
};

const Debug_Empty = (Given) =>
  Given.type === undefined && Given.request === undefined &&
  Given.name === undefined;

const Debug_Initial = () =>
  ((Executable) => ({
     type: Debug_Type,
     request: 'launch',
     name: 'Ada 83: debug the main',
     program: Executable === null
       ? '${workspaceFolder}/main'
       : ((Relative) =>
            path.isAbsolute (Relative)
              ? Relative
              : '${workspaceFolder}/' + Relative)
           (vscode.workspace.asRelativePath (Executable)),
     stopOnEntry: false,
   }))
    (((Element) =>
        Element === undefined
          ? null
          : Sidebar_Executable (Element.Given, Element.Main))
       (Debug_Mains ()[0]));

const Debug_Provider = (Memory, Output) => ({
  provideDebugConfigurations: () => [Debug_Initial ()],
  resolveDebugConfiguration: async (Ignored, Given) => {
    if (Given[Debug_Prebuilt] === true)
      return Without (Given, Debug_Prebuilt);
    if (!Debug_Empty (Given)) {
      if (Active_Project () === null) return Given;
      const Outcome = await Sidebar_Build (Memory, Clean_Project, Output) (
        undefined, true);
      return Outcome !== null && Outcome !== undefined && Outcome.Code === 0
        ? Given : undefined;
    }
    const Element = Debug_Mains ()[0];
    if (Element !== undefined)
      return (await Debug_Built (Memory, Output) (Element)) ?? undefined;
    vscode.window.showInformationMessage (
      'Ada 83: no active project declares a Main to fill a debug ' +
      'configuration from; write one in launch.json.');
    return undefined;
  },
});

const Debug_Registration = (Memory, Output) =>
  [vscode.debug.registerDebugAdapterDescriptorFactory (
     Debug_Type, Debug_Adapter_Factory),
   vscode.debug.registerDebugConfigurationProvider (
     Debug_Type, Debug_Provider (Memory, Output)),
   vscode.commands.registerCommand ('ada83.debugMain',
     Debug_Main (Memory, Output)),
   vscode.commands.registerCommand ('ada83.debugMainWithProgress',
     Debug_Main (Memory, Output))];

const Ada_Tasks_View = 'ada83.tasksView';

let Ada_Tasks = [];

const Ada_Tasks_Changes = new vscode.EventEmitter ();

const Ada_Task_Rows_Of = (Body) =>
  Array.isArray (Body?.tasks)
    ? Body.tasks.filter (({ id }) => Number.isInteger (id))
    : [];

const Ada_Tasks_Shown = (Tasks) => {
  Ada_Tasks = Tasks;
  Ada_Tasks_Changes.fire (undefined);
};

const Ada_Tasks_Refreshed = (Session) =>
  Promise.resolve (Session.customRequest ('ada83/tasks'))
    .then (Ada_Task_Rows_Of)
    .catch (() => [])
    .then (Ada_Tasks_Shown);

const Ada_Task_Dependents = (Id) =>
  Ada_Tasks.filter (({ id, parent }) => parent === Id && id !== Id);

const Ada_Task_Roots = () =>
  ((Ids) =>
     Ada_Tasks.filter (({ id, parent }) =>
       parent === 0 || parent === id || !Ids.has (parent)))
    (new Set (Ada_Tasks.map (({ id }) => id)));

const Ada_Task_Item = (Task) =>
  Object.assign (
    new vscode.TreeItem (Task.name,
      Ada_Task_Dependents (Task.id).length === 0
        ? vscode.TreeItemCollapsibleState.None
        : vscode.TreeItemCollapsibleState.Expanded),
    { id: String (Task.id),
      description: Task.state,
      tooltip: `${Task.name} — ${Task.state}`,
      iconPath: new vscode.ThemeIcon ('symbol-event') });

const Ada_Tasks_Provider = {
  onDidChangeTreeData: Ada_Tasks_Changes.event,
  getTreeItem: Ada_Task_Item,
  getChildren: (Element) =>
    Element === undefined ? Ada_Task_Roots ()
                          : Ada_Task_Dependents (Element.id),
};

const Ada_Tasks_Session = (Session) => {
  const Debugging = Session !== undefined && Session.type === Debug_Type;
  vscode.commands.executeCommand ('setContext', 'ada83.debugging',
                                  Debugging);
  if (Debugging) Ada_Tasks_Refreshed (Session);
  else Ada_Tasks_Shown ([]);
};

const Ada_Tasks_Tracker = (Session) => ({
  onDidSendMessage: (Message) => {
    if (Message.type === 'event' && Message.event === 'stopped')
      Ada_Tasks_Refreshed (Session);
  },
});

const Ada_Tasks_Registration = () => {
  Ada_Tasks_Session (vscode.debug.activeDebugSession);
  return [
    vscode.window.registerTreeDataProvider (Ada_Tasks_View,
                                            Ada_Tasks_Provider),
    vscode.debug.onDidChangeActiveDebugSession (Ada_Tasks_Session),
    vscode.debug.registerDebugAdapterTrackerFactory (Debug_Type,
      { createDebugAdapterTracker: Ada_Tasks_Tracker }),
  ];
};

const activate = (Context) => {
  vscode.commands.executeCommand ('setContext', 'ada83.relevant', true);
  const Output = vscode.window.createOutputChannel ('Ada 83');
  const Diagnostics = vscode.languages.createDiagnosticCollection ('ada83');
  const Complaints =
    vscode.languages.createDiagnosticCollection ('ada83-project');
  const Status = vscode.window.createStatusBarItem (
    vscode.StatusBarAlignment.Right, 100);
  Status.command = 'ada83.showOutput';
  Project_Item = vscode.window.createStatusBarItem (
    vscode.StatusBarAlignment.Right, 99);
  Trace_Channel = Output;
  Tracing = Configured ('trace.server', 'off');

  const Read_The_Project = () =>
    Project_Refresh (Complaints)
      .then (Refresh_Sidebar)
      .catch ((Reason) =>
        Output.appendLine (`project unread: ${Reason.message}`));

  const Reload = () =>
    Read_The_Project ().then (() => Restart (Diagnostics, Output, Status));

  let Settling = null;
  const Reload_Soon = () => {
    if (Settling !== null) clearTimeout (Settling);
    Settling = setTimeout (() => { Settling = null; Reload (); }, 250);
  };

  Compiler_Settled (Context)
    .catch (() => null)
    .then (Read_The_Project)
    .then (() => {
      if (Session === null) Start (Diagnostics, Output, Status, 0);
    });

  Context.subscriptions.push (
    Output,
    Diagnostics,
    Complaints,
    Status,
    Project_Item,
    { dispose: Stop },
    vscode.workspace.onDidOpenTextDocument (On_Ada (Did_Open)),
    vscode.workspace.onDidChangeTextDocument (Settles_Down (Did_Change)),
    vscode.workspace.onDidCloseTextDocument (On_Ada (Did_Close)),
    vscode.workspace.onDidSaveTextDocument (On_Ada (Did_Change)),
    vscode.workspace.onDidChangeConfiguration ((Change) => {
      Tracing = Configured ('trace.server', 'off');
      if (Touches_The_Project (Change)) return void Reload ();
      if (Touches_The_Server (Change)) Restart (Diagnostics, Output, Status);
    }),
    Watched_Folders (Reload_Soon),
    ...Watched_Projects (Reload_Soon),
    vscode.commands.registerCommand ('ada83.build',
                                     Run_On_The_Active_File (Build_Task)),
    vscode.commands.registerCommand ('ada83.check',
                                     Run_On_The_Active_File (Check_Task)),
    vscode.commands.registerCommand ('ada83.selectProject', Select_Project),
    vscode.commands.registerCommand ('ada83.setScenario', Set_Scenario),
    vscode.commands.registerCommand (
      'ada83.buildProject',
      Build_Project (Context.workspaceState, Clean_Project)),
    vscode.commands.registerCommand (
      'ada83.buildMain',
      Build_Main (Context.workspaceState, Clean_Project)),
    vscode.commands.registerCommand ('ada83.showPlan', Show_Plan),
    vscode.commands.registerCommand ('ada83.cleanProject', Clean_Project),
    vscode.commands.registerCommand ('ada83.restartServer',
                                     () => Restart (Diagnostics, Output,
                                                    Status)),
    vscode.commands.registerCommand ('ada83.showOutput',
                                     () => Output.show (true)),
    vscode.tasks.registerTaskProvider ('ada83', Task_Provider),
    ...Sidebar_Registration (Context.workspaceState, Output,
                             Read_The_Project),
    ...Debug_Registration (Context.workspaceState, Output),
    ...Ada_Tasks_Registration (),
    ...Bootstrap_Registration (Context),
    ...Scaffold_Registration (Context),
    ...Manual_Registration (Context.extensionPath),
    ...Reformat_Registration (Context.extensionPath),
    ...Suggestion_Registration (Context.extensionPath),
    ...On_Type_Registration ());
};

const deactivate = Stop;

module.exports = { activate, deactivate };

</script>
