<script id="README.md" type="text/markdown">
# Ada 83 for Visual Studio Code

Ada 83 (ANSI/MIL-STD-1815A) language support, powered by the [`ada83`
compiler](https://github.com/AdaDoom3/Ada83). The extension talks to
`ada83 --lsp`, the compiler's own language server, so diagnostics, hovers,
completions and every other answer come from the exact same front end that
builds your code — there is no second parser to disagree with the first.

## Features

- **Diagnostics** as you type, spanning the whole name they complain about.
  A `previous declaration at ...` note arrives as a linked related location
  — click it in the Problems panel and land on the declaration — and a
  `did you mean ...?` note becomes a one-click quick fix that renames the
  identifier under the diagnostic. All three come from the compiler itself,
  not from a regex over its output
- **Go to Definition**, including into `ada83-runtime.ada`, the standard library
- **Find All References**, **Document Highlights** and **workspace symbols**
- **Hover** showing the declaration as Ada 83 declares it
- **Completion** for names in scope, including the runtime
- **Signature Help** for the call being written
- **Document Outline** and **Folding**, from the compiler's own view of the unit
- **Syntax highlighting** for all 63 Ada 83 reserved words, and **file icons**
  for `.ada`, `.ads`, `.adb`, `.gpr` and `.gpj`
- **Semantic Highlighting**: the compiler says what kind of thing each name
  is — package, type, subprogram, parameter, enumeration literal, object —
  so a theme can colour `COUNT` the type apart from `COUNT` the variable,
  which no grammar can
- **Code Lenses** over every library-level parameterless procedure — the
  ones the compiler accepts as mains — offering *Build*, *Build Main* and
  *Plan*
- **A Project sidebar** — the tree `-P` resolved, imports and all, with
  Build, Run and Debug on every main, live build progress, and scenario
  variables as rows
- **Debugging, adapter included** — `F5` or the Debug button on a main
  rebuilds it with `-g` and starts it under `ada83 --dap`: the compiler
  speaks the Debug Adapter Protocol itself, lldb-dap underneath, Ada
  names throughout, and a **Tasks** view of the program's Ada tasks at
  every stop
- **Snippets** from a compilation unit to a record representation clause
- **Build** and **Check** commands (`Ctrl+Alt+B` / `Ctrl+Alt+C`), wired up as
  tasks with a problem matcher
- **Project files**, `.gpr` and `.gpj`: plan, build and clean with `-P`, mains
  as tasks, **scenario variables** set from a typed picker (`Ctrl+Alt+X`)
- **New Project** scaffolds a buildable project from one name
- **The compiler itself, found or fetched**: point at one, or let the
  extension download a released build
- **Suggest A Fix**, a model-written repair shown as a diff, applied only if
  you approve it and only if it compiles
- **Format Document** and format-on-save to the style the standard itself
  uses, plus model-free reindentation as you type
- **Diagnostics in your language**, translated on request, English by default
- A **`search_ada83_manual` tool** so AI assistants read the standard rather
  than recall a later Ada

## Zero to compiled

1. Install the extension and open a folder.
2. If no `ada83` is found, accept the offer to **download** one (or point
   `ada83.compilerPath` at yours). The status bar names whichever compiler
   answered.
3. Run **Ada 83: New Project**, give it a name.
4. `Ctrl+Alt+Shift+B` builds it; the binary lands beside the project file.

## The compiler

Everything past colouring is answered by the `ada83` executable, so the
extension resolves one on activation, in this order:

1. **`ada83.compilerPath`**, when you have set it;
2. **`bin-linux/`, `bin-macos/` or `bin-windows/` under the workspace** —
   the layout the compiler's own repository builds into;
3. **`ada83` on PATH**;
4. failing all three, an **offer to download** a released build or locate one.

A project may pin its own: `IDE'Compiler_Command ("ada")` names the
compiler the project is built and analysed with whenever
`ada83.compilerPath` is not set, and the setting always wins when it is.

A candidate counts only if `--version` answers. The download goes to the
extension's own storage, is staged and adopted only after `--version`
answers there too, and always places `ada83-runtime.ada` — which the
compiler requires beside its executable — next to the binary, plus the
vendored DLLs on Windows. Whatever is adopted is written back to
`ada83.compilerPath`, put first on `PATH` in integrated terminals, and named
in the status bar with its version. **Ada 83: Download Or Update The
Compiler** re-fetches at any time; `ada83.downloadBase` points the fetch at
a mirror (http, https or file URLs).

The extension makes no other network request, and sends no telemetry.

## Projects

Point the extension at a project and it hands it to the compiler as
`-P`. A single `.gpr` or `.gpj` at the root of the workspace is found on its
own; anywhere else, name it in `ada83.projectFile` or run **Ada 83: Select
The Active Project**. If the root holds more than one, none is active until
you choose — the status bar says so and clicking it asks.

With a project active:

- its **source directories**, and those of everything it withs, are searched
  for with-ed units, so go-to-definition and completion see the whole tree
- **Ada 83: Build The Active Project** (`Ctrl+Alt+Shift+B`) compiles and
  links; each **main** is also a task of its own, and **Build A Main From
  The Project** picks one
- **Ada 83: Show The Build Plan** runs `-n`, which prints what the project
  resolves to — sources, switches, imports and externals — and builds nothing
- **Ada 83: Clean The Project** removes the compiler's own products (`.ali`,
  `.ll`, `.o`, `.s`) from `Object_Dir` and the mains from `Exec_Dir`, after
  asking. It touches nothing else
- diagnostics from the project file itself land in the Problems panel with
  everything else. An attribute the compiler does not know is a **warning**,
  not an error, so a GNAT tree carrying `package Pretty_Printer` marks it
  and builds

**Ada 83: New Project** goes the other way: give it a name and it writes
`<name>.gpr` with a typed scenario variable, a `src/` directory and a main
that prints a line — a complete project every command above acts on at once.

### Scenario variables

A project sets its knobs from `external (...)`, and a typed one names the
values it may take:

```ada
type Build_Kind is ("debug", "release");
Build : Build_Kind := external ("BUILD", "debug");
```

**Ada 83: Set A Scenario Variable** (`Ctrl+Alt+X`, or the status bar item)
asks the compiler to list what the project declares, types, defaults and
all (`--externals`). A typed variable is offered exactly its type's
literals, because those are exactly the values it may take — a closed list
and not a text box; an untyped one opens a text box with its default filled
in, and emptying that box unsets it again. What you choose is remembered in
the workspace, as `ada83.scenario`, and passed to every build and every
plan as `-X NAME=VALUE`; the language server is then restarted over the
source directories that scenario resolves to. The same picker resets every
variable to the project's own defaults, and names one the project does not
reach under the current setting. An older compiler that cannot list
externals still gets a picker: the names the plan resolved, as free text.

An external declared with **no default** and left unset is an error, in
gprbuild and here: the compiler refuses to read the project and says which
one, the message appears against the project file, and the status bar shows
the project in error until it is set.

Changing a variable re-reads the project and restarts the language server.
The compiler records the scenario a build used in its object directory and
rebuilds what a change invalidates, so switching back and forth does not
hand you stale objects.

### The Project sidebar

The Ada 83 icon in the activity bar opens the project explorer: the tree
`-P` resolved, drawn from the compiler's own answers (`--plan-json` for
the tree, `--externals` for the variables), so the sidebar cannot come to
disagree with the build.

- the **root project** expands to its attributes — `Source_Dirs`,
  `Object_Dir`, switches plain and indexed, spelled as the plan spells
  them — its typed declarations and variables, and its **imports**, each
  a project node of its own, expandable the same way
- a project recording more than Ada groups its **sources by language** —
  Ada, C, C++, and Other with each file's recorded language beside it —
  from the `Ada_Sources`, `C_Sources`, `CPP_Sources` and `Other_Sources`
  the plan answers; an Ada-only project reads exactly as before
- every **main** carries inline **Build** and **Run** buttons. Build runs
  the compiler with `--progress` and renders each compile as it happens —
  *compiling 3/17 — pack.adb* — and a build with nothing to do says so:
  *up to date — nothing to compile*. Run builds first, then starts the
  image in a terminal. Both offer to clean first when the scenario changed
  since the last build, like the build tasks do
- **scenario variables** are rows, `NAME = value (origin)`. Clicking a
  typed one opens exactly its type's literals, an untyped one a text box
  with its default filled in, and the choice lands in `ada83.scenario`
  exactly as the picker's would
- the view refreshes when a project file is saved or the scenario
  changes, and by hand from its title bar

### What the compiler answers today

Project support arrived in the compiler a stage at a time, and the
extension says whatever the compiler says rather than pretending
otherwise. A current compiler reads a project (`-P`), plans (`-n`, and
`--plan-json` for tools), lists the externals with their types
(`--externals`), builds in dependency order, and narrates a build one
`PROGRESS` line per compile (`--progress`). With an older compiler the
extension degrades a feature at a time: the typed picker falls back to
the externals the plan resolved, as free text; the sidebar falls back to
the `-n` plan, which carries no indexed attributes — less, never wrong;
one that answers no per-language source keys and no `package IDE`
attributes shows no language groups and pins nothing.
The sidebar's Build button asks for `--progress` and needs a compiler
that knows it; the build *tasks* (`Ctrl+Alt+Shift+B` and friends) pass no
such flag and work with any.

## Debugging

`F5`, **Ada 83: Debug A Main From The Project**, or the **Debug** button
on a main in the project view. The extension rebuilds the main with `-g`
first — the same progress build the sidebar's Build runs, `-P` and every
`-X` preserved — then starts the executable under the debug adapter,
which is the compiler itself: `ada83 --dap` speaks the Debug Adapter
Protocol on stdio, drives lldb-dap underneath — LLVM end to end, the
same toolchain that assembled the code — and does the Ada spelling
itself: **breakpoints, stepping, variables and expressions** work, and
names are translated on the way through, so what you read is what Ada
declares rather than an encoded linkage name. While the program stands
stopped, a **Tasks** view in Run and Debug lists its Ada tasks — each
master expandable to its dependents, the state beside each name — read
through the adapter from the runtime's own records; a compiler too old
to answer leaves the view empty, never wrong. There are no other moving
parts: no adapter code in the extension, no debugger script anywhere.

A `launch.json` is optional — with none, `F5` on the project debugs its
first main — and when one names a `program`, the project is still
rebuilt with `-g` before the adapter gets it. A compiler that predates
`--dap` is refused with a message pointing at **Ada 83: Download Or
Update The Compiler**, not half-served; `ada83.debugAdapterPath` runs
any other DAP executable — raw lldb-dap, say — verbatim in its place,
for those who want the untranslated view, and a project naming
`IDE'Debugger_Command` runs that command line, quotes honored, while
the setting is empty.

The same story holds outside the editor. `ada83 -g` builds a binary
every LLVM tool reads — lldb, lldb-dap — and `ada83 --debug prog`
debugs one in the terminal, the same engine and the same Ada spelling
as the adapter. gdb is the exception: its Ada mode wants its own
dialect of the debug information, so build with `-ggdb` — `-g` in every
other respect — and gdb 14+ then speaks Ada natively, `break
pack.proc`, `print rec.field`; gdb's `catch exception` and `info tasks`
lean on GNAT runtime hooks this runtime does not provide. Either flag
defaults the build to `-O0` unless an explicit `-O` says otherwise, so
what you step through is what you wrote.

## Requirements

- Visual Studio Code 1.106 or later, or a compatible editor.
- The `ada83` compiler. If none is found the extension offers to download a
  released build; nothing else is required.
- `ada83-runtime.ada` beside the compiler executable — the download places
  it there; keep it there if you install by hand.
- To debug: a compiler new enough to know `--dap` — the extension offers
  the update — with lldb-dap on PATH underneath it, or
  `ada83.debugAdapterPath` naming any DAP executable to run instead.

## What this is not

Honesty is cheaper than a surprised bug report:

- **Not Ada 95, 2005, 2012 or 2022.** No tagged types, no child units, no
  `aliased`, none of the 6 reserved words Ada 95 added. The compiler
  rejects them, and this extension serves this compiler. For modern Ada,
  use AdaCore's tooling. A set of later constructs is available as named
  extensions admitted by default, and refused when
  `ada83.languageExtensions` is off — protected
  types, controlled types, expression functions, if and case expressions,
  aspect specifications, access-to-subprogram and general access types,
  dot notation on a leading `in out` formal, Ada 95 unit names, the
  generic formal defaults beyond Ada 83, and a handful of small ones —
  and a program that uses one is not a legal Ada 83 program, which is why
  the setting is off by default.
- **Not GNAT tooling.** A GNAT project tree usually loads — unknown
  attributes are warnings, and `package IDE` is read: `Compiler_Command
  ("ada")` and `Debugger_Command` steer the extension, the rest ride the
  project tooltip — but nothing here runs gprbuild or gnatpp. Debugging
  is the compiler's own `--dap` adapter over lldb; gdb's Ada mode reads
  binaries built with `-ggdb` outside the editor.
- **Formatting, Suggest A Fix and translated diagnostics ask a language
  model** available inside your editor, decline politely when there is
  none, and never apply an answer that does not compile. Everything else —
  diagnostics, navigation, completion, builds — is model-free and works
  offline.
- **The file icon theme is deliberately minimal.** VS Code applies one icon
  theme to all files, so choosing "Ada 83 File Icons" gives Ada and project
  files their marks and everything else a plain document.
- **No screenshots here.** The walkthrough's picture of the scenario picker
  is an SVG rendering labelled as such, not a screenshot pretending to be
  the product.

- [Issue tracker](https://github.com/AdaDoom3/Ada83/issues)
- [Language reference (`ada83-manual.md`)](https://github.com/AdaDoom3/Ada83/blob/main/ada83-manual.md)

<script id="readme-tables.js" type="text/javascript">
#!/usr/bin/env node
'use strict';

const fs = require ('fs');
const path = require ('path');

const Root = process.argv[2] ?? __dirname;

const Read = (Name) =>
  JSON.parse (fs.readFileSync (path.join (Root, Name), 'utf8'));

const Manifest = Read ('package.json');
const Snippets = Read ('snippets.json');

const Cell = (Text) =>
  String (Text).replace (/\|/g, '\\|').replace (/\s*\r?\n\s*/g, ' ');

const First_Sentence = (Text) =>
  ((Match) => (Match === null ? Text : Match[0]))
    (/^.*?[.!?](?=\s|$)/s.exec (Text));

const Table = (Head, Rows) =>
  [`| ${Head.join (' | ')} |`,
   `|${Head.map (() => '---').join ('|')}|`,
   ...Rows.map ((Row) => `| ${Row.map (Cell).join (' | ')} |`)].join ('\n');

const Keys_For = (Command) =>
  (Manifest.contributes.keybindings ?? [])
    .filter ((Bound) => Bound.command === Command)
    .map (({ key, mac }) =>
      (mac === undefined ? `\`${key}\`` : `\`${key}\` / \`${mac}\``))
    .join (', ');

const Shown_Default = (Given) =>
  Given === undefined || Given === '' ? '' : `\`${JSON.stringify (Given)}\``;

const Tables = {
  commands: Table (['Command', 'Keys', 'Identifier'],
    Manifest.contributes.commands.map ((Command) =>
      [`${Command.category}: ${Command.title}`,
       Keys_For (Command.command),
       `\`${Command.command}\``])),
  settings: Table (['Setting', 'Default', 'What it does'],
    Object.entries (Manifest.contributes.configuration.properties)
      .map (([Name, About]) =>
        [`\`${Name}\``,
         Shown_Default (About.default),
         First_Sentence (About.description)])),
  snippets: Table (['Prefix', 'Expands to'],
    Object.values (Snippets).map ((Snippet) =>
      [`\`${Snippet.prefix}\``, Snippet.description])),
};

const Readme_Path = path.join (Root, 'README.md');
let Readme = fs.readFileSync (Readme_Path, 'utf8');
const Missing = [];

Object.entries (Tables).forEach (([Name, Body]) => {
  const Marked = new RegExp (
    `(<!-- BEGIN GENERATED: ${Name}[^>]*-->)[\\s\\S]*?` +
    `(<!-- END GENERATED: ${Name} -->)`);
  if (!Marked.test (Readme)) return Missing.push (Name);
  Readme = Readme.replace (Marked, `$1\n${Body}\n$2`);
});

if (Missing.length > 0) {
  console.error (`README.md lost its generated markers: ${Missing.join (', ')}`);
  process.exit (1);
}

fs.writeFileSync (Readme_Path, Readme);
console.log ('README tables regenerated from the manifest');
</script>

<script id="ada83.instructions.md" type="text/markdown">
---
name: Ada 83
description: What Ada 83 (ANSI/MIL-STD-1815A) allows, and where to look it up.
---

These files are Ada 83 (ANSI/MIL-STD-1815A). They are not Ada 95, 2005, 2012
or 2022, and the `ada83` compiler that checks them rejects anything later.

Never write tagged types, protected objects or child units, and never write
`abstract`, `aliased`, `requeue`, `until`, `interface`, `overriding`,
`synchronized` or `some`: every one of those is Ada 95, 2005 or 2012. Ada 83
has exactly 63 reserved words, and a construct needing a 64th is not Ada 83.
The compiler does accept a set of later constructs by default, protected and
controlled types among them; if the project you are editing is built with
`-ada83`, none of them belongs in these files.

Prefer the predefined packages the bundled runtime declares: `Standard`,
`System`, `Text_IO` and its `Integer_IO`, `Float_IO`, `Fixed_IO` and
`Enumeration_IO`, `Sequential_IO`, `Direct_IO`, `IO_Exceptions`, `Calendar`,
`Low_Level_IO`, `Machine_Code`, `Unchecked_Conversion` and
`Unchecked_Deallocation`.

When legality is in question at all - visibility, overload resolution,
representation clauses, implementation permissions, or whether a construct is
Ada 83 in the first place - read the standard with the `search_ada83_manual`
tool (`#ada83Manual`) instead of recalling modern Ada.
</script>

      "type ${1:Money} is delta ${2:0.01} range ${3:0.0} .. ${4:1_000.0};$0"
    ],
    "description": "A fixed point type"
  },
  "floating point type": {
    "prefix": "float",
    "body": [
      "type ${1:Real} is digits ${2:12};$0"
    ],
    "description": "A floating point type"
  },
  "access type": {
    "prefix": "access",
    "body": [

    ],
    "description": "An access type"
  },
  "private type": {
    "prefix": "private",
    "body": [
      "type ${1:Handle} is private;",
      "private",

    ],
    "description": "A private type and its full declaration"
  },
  "exception declaration": {
    "prefix": "exceptiondecl",

      "${1:Name}_Error : exception;$0"
    ],
    "description": "An exception declaration"

    ],
    "description": "A raise statement"
  },
  "loop with exit": {
    "prefix": "loop",
    "body": [
      "${1:Search} :",
      "loop",
      "   exit ${1:Search} when ${2:Done};",
      "   $0",
      "end loop ${1:Search};"
    ],
    "description": "A named loop with an exit"
  },
  "text io use": {
    "prefix": "textio",
    "body": [
      "with Text_IO; use Text_IO;",

  },
  "integer io instantiation": {
    "prefix": "integerio",
    "body": [
      "package ${1:Int_IO} is new Text_IO.Integer_IO (${2:Integer});",

  },
  "pragma": {
    "prefix": "pragma",
    "body": [

  },
  "representation clause": {

    "body": [
      "for ${1:Register} use",
      "   record",
      "      ${2:Field} at ${3:0} range ${4:0} .. ${5:7};",
      "   end record;$0"
    ],
    "description": "A record representation clause"
  }
}
</script>

<script id="syntaxes/ada83.tmLanguage.json" type="application/json">
{
  "$schema": "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json",
  "name": "Ada 83",
  "scopeName": "source.ada",
  "patterns": [
    { "include": "#comment" },
    { "include": "#string" },
    { "include": "#character" },
    { "include": "#number" },
    { "include": "#pragma" },
    { "include": "#context" },
    { "include": "#label" },
    { "include": "#declaration" },
    { "include": "#closing" },
    { "include": "#loop_parameter" },
    { "include": "#choice" },
    { "include": "#association" },
    { "include": "#attribute" },
    { "include": "#predefined" },
    { "include": "#literal" },
    { "include": "#keyword" },
    { "include": "#parameter" },
    { "include": "#operator" },
    { "include": "#punctuation" }
  ],
  "repository": {
    "comment": {
      "name": "comment.line.double-dash.ada",
      "match": "(--).*$",
      "captures": {
        "1": { "name": "punctuation.definition.comment.ada" }
      }
    },
    "string": {
      "patterns": [
        {
          "name": "string.quoted.double.ada",
          "match": "\"(?:[^\"]|\"\")*\""
        },
        {
          "name": "invalid.illegal.unterminated-string.ada",
          "match": "\"[^\"]*$"
        }
      ]
    },
    "character": {
      "comment": "A tick opens a character literal only when the tick before it cannot close a prefix: after an identifier character or ')' the tick is an attribute or qualified-expression mark, so T'A'FIRST and CHARACTER'('A') both read correctly.",
      "name": "string.quoted.single.ada",
      "match": "(?<![A-Za-z0-9_)])'.'"
    },
    "number": {
      "patterns": [
        {
          "name": "constant.numeric.based.ada",
          "match": "\\b\\d[\\d_]*#[0-9A-Fa-f_]+(?:\\.[0-9A-Fa-f_]+)?#(?:[Ee][+-]?\\d[\\d_]*)?"
        },
        {
          "name": "constant.numeric.decimal.ada",
          "match": "\\b\\d[\\d_]*(?:\\.[\\d_]+)?(?:[Ee][+-]?\\d[\\d_]*)?\\b"
        }
      ]
    },
    "context": {
      "begin": "(?i)\\b(with|use)\\b(?=\\s+(?!function\\b|procedure\\b|record\\b|at\\b)[A-Za-z])",
      "beginCaptures": {
        "1": { "name": "keyword.other.ada" }
      },
      "end": ";",
      "endCaptures": {
        "0": { "name": "punctuation.terminator.ada" }
      },
      "patterns": [
        { "include": "#comment" },
        {
          "name": "entity.name.namespace.ada",
          "match": "[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*"
        },
        { "name": "punctuation.separator.ada", "match": "," },
        { "include": "#number" },
        { "include": "#operator" }
      ]
    },
    "pragma": {
      "patterns": [
        {
          "match": "(?i)\\b(pragma)\\s+(controlled|elaborate|inline|interface|list|memory_size|optimize|pack|page|priority|shared|storage_unit|suppress|system_name)\\b",
          "captures": {
            "1": { "name": "keyword.other.pragma.ada" },
            "2": { "name": "support.function.pragma.ada" }
          }
        },
        {
          "match": "(?i)\\b(pragma)\\s+([A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.pragma.ada" },
            "2": { "name": "entity.name.tag.ada" }
          }
        }
      ]
    },
    "label": {
      "patterns": [
        {
          "match": "(<<)\\s*([A-Za-z][A-Za-z0-9_]*)\\s*(>>)",
          "captures": {
            "1": { "name": "punctuation.definition.label.ada" },
            "2": { "name": "entity.name.label.ada" },
            "3": { "name": "punctuation.definition.label.ada" }
          }
        },
        {
          "match": "(?i)^\\s*([A-Za-z][A-Za-z0-9_]*)\\s*(:)\\s*(?=(?:for\\b|while\\b|loop\\b|declare\\b|begin\\b|$))",
          "captures": {
            "1": { "name": "entity.name.label.ada" },
            "2": { "name": "punctuation.separator.ada" }
          }
        }
      ]
    },
    "declaration": {
      "patterns": [
        {
          "match": "(?i)\\b(procedure|function|entry)\\s+(\"[^\"]+\"|[A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "entity.name.function.ada" }
          }
        },
        {
          "match": "(?i)\\b(package)\\s+(body\\s+)?([A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "keyword.other.ada" },
            "3": { "name": "entity.name.namespace.ada" }
          }
        },
        {
          "match": "(?i)\\b(task)\\s+(body\\s+|type\\s+)?([A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "keyword.other.ada" },
            "3": { "name": "entity.name.type.ada" }
          }
        },
        {
          "match": "(?i)\\b(type|subtype)\\s+([A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "entity.name.type.ada" }
          }
        },
        {
          "match": "(?i)\\b(accept)\\s+([A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "entity.name.function.ada" }
          }
        },
        {
          "match": "(?i)\\b(is)\\s+(new)\\s+([A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "keyword.other.ada" },
            "3": { "name": "entity.name.type.ada" }
          }
        },
        {
          "match": "(?i)\\b(raise)\\s+([A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "entity.name.type.ada" }
          }
        },
        {
          "match": "(?i)\\b(new)\\s+([A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "entity.name.type.ada" }
          }
        },
        {
          "match": "(?i)\\b([A-Za-z][A-Za-z0-9_]*(?:\\s*,\\s*[A-Za-z][A-Za-z0-9_]*)*)\\s*(:)\\s*(exception)\\b",
          "captures": {
            "1": { "name": "entity.name.type.exception.ada" },
            "2": { "name": "punctuation.separator.ada" },
            "3": { "name": "keyword.other.ada" }
          }
        }
      ]
    },
    "closing": {
      "patterns": [
        {
          "match": "(?i)\\b(end)\\s+(loop)\\s+([A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "keyword.other.ada" },
            "3": { "name": "entity.name.label.ada" }
          }
        },
        {
          "match": "(?i)\\b(end)\\s+(?!(?:if|case|loop|record|select)\\b)(\"[^\"]+\"|[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*)",
          "captures": {
            "1": { "name": "keyword.other.ada" },
            "2": { "name": "entity.name.section.ada" }
          }
        }
      ]
    },
    "loop_parameter": {
      "match": "(?i)\\b(for)\\s+([A-Za-z][A-Za-z0-9_]*)\\s+(in)\\b\\s*(reverse\\b)?",
      "captures": {
        "1": { "name": "keyword.other.ada" },
        "2": { "name": "variable.other.loop.ada" },
        "3": { "name": "keyword.other.ada" },
        "4": { "name": "keyword.other.ada" }
      }
    },
    "association": {
      "match": "(?i)\\b(?!others\\b)([A-Za-z][A-Za-z0-9_]*)\\s*(=>)",
      "captures": {
        "1": { "name": "variable.parameter.ada" },
        "2": { "name": "keyword.operator.ada" }
      }
    },
    "choice": {
      "begin": "(?i)\\b(when)\\b",
      "beginCaptures": {
        "1": { "name": "keyword.other.ada" }
      },
      "end": "(=>)|(;)",
      "endCaptures": {
        "1": { "name": "keyword.operator.ada" },
        "2": { "name": "punctuation.terminator.ada" }
      },
      "patterns": [
        { "include": "#comment" },
        { "include": "#string" },
        { "include": "#character" },
        { "include": "#number" },
        { "include": "#literal" },
        { "include": "#predefined" },
        { "include": "#attribute" },
        { "include": "#keyword" },
        { "include": "#operator" },
        { "include": "#punctuation" }
      ]
    },
    "attribute": {
      "match": "(')\\s*([A-Za-z][A-Za-z0-9_]*)",
      "captures": {
        "1": { "name": "punctuation.definition.attribute.ada" },
        "2": { "name": "entity.other.attribute-name.ada" }
      }
    },
    "predefined": {
      "patterns": [
        {
          "name": "support.type.ada",
          "match": "(?i)\\b(Integer|Natural|Positive|Float|Boolean|Character|String|Duration|Short_Integer|Long_Integer|Short_Float|Long_Float|Short_Short_Integer|Long_Long_Integer|Universal_Integer|Universal_Real|File_Type|File_Mode|Address|Priority)\\b"
        },
        {
          "name": "support.class.ada",
          "match": "(?i)\\b(Standard|ASCII|System|Calendar|Text_IO|Sequential_IO|Direct_IO|IO_Exceptions|Low_Level_IO|Machine_Code|Unchecked_Conversion|Unchecked_Deallocation|Integer_IO|Float_IO|Fixed_IO|Enumeration_IO)\\b"
        }
      ]
    },
    "literal": {
      "patterns": [
        {
          "name": "constant.language.boolean.ada",
          "match": "(?i)\\b(True|False)\\b"
        },
        {
          "name": "support.class.exception.ada",
          "match": "(?i)\\b(Constraint_Error|Numeric_Error|Program_Error|Storage_Error|Tasking_Error|Status_Error|Mode_Error|Name_Error|Use_Error|Device_Error|End_Error|Data_Error|Layout_Error|Time_Error)\\b"
        }
      ]
    },
    "keyword": {
      "comment": "All 63 reserved words take one scope, so every construct's bracket words match under any theme: procedure/is/begin/exception/end one color, accept/do/end one color, if/then/end if one color. Only null stands apart, because it is a value, and its Dark+ color happens to coincide.",
      "patterns": [
        {
          "name": "constant.language.null.ada",
          "match": "(?i)\\bnull\\b"
        },
        {
          "name": "keyword.other.ada",
          "match": "(?i)\\b(abort|abs|accept|access|all|and|array|at|begin|body|case|constant|declare|delay|delta|digits|do|else|elsif|end|entry|exception|exit|for|function|generic|goto|if|in|is|limited|loop|mod|new|not|of|or|others|out|package|pragma|private|procedure|raise|range|record|rem|renames|return|reverse|select|separate|subtype|task|terminate|then|type|use|when|while|with|xor)\\b"
        }
      ]
    },
    "parameter": {
      "comment": "A mode is declarative, not a membership test, so 'in out' takes the declarative scope as one piece rather than splitting into operator-in and other-out. The colon must not be the head of ':=', or an assignment's target reads as a declaration and the delimiter splits in two.",
      "match": "(?i)\\b([A-Za-z][A-Za-z0-9_]*)\\s*(:)(?!=)\\s*((?:in\\s+out|in|out)\\b)?",
      "captures": {
        "1": { "name": "variable.parameter.ada" },
        "2": { "name": "punctuation.separator.ada" },
        "3": { "name": "keyword.other.ada" }
      }
    },
    "operator": {
      "name": "keyword.operator.ada",
      "match": "(:=|=>|\\.\\.|\\*\\*|/=|>=|<=|<>|[+\\-*/&<>=|])"
    },
    "punctuation": {
      "patterns": [
        { "name": "punctuation.terminator.ada", "match": ";" },
        { "name": "punctuation.separator.ada", "match": "[,:.]" },
        { "name": "punctuation.section.parens.ada", "match": "[()]" },
        { "name": "punctuation.definition.attribute.ada", "match": "'" }
      ]
    }
  }
}
</script>

<script id="syntaxes/gpr.tmLanguage.json" type="application/json">
{
  "$schema": "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json",
  "name": "GNAT Project",
  "scopeName": "source.gpr",
  "comment": "A .gpr is lexically an Ada subset, so the reserved words take the same partition as source.ada: case/when steer, everything else declares. The qualifiers and 'project' itself are contextual keywords, matched only where the grammar of a project file puts them.",
  "patterns": [
    { "include": "#comment" },
    { "include": "#string" },
    { "include": "#qualifier" },
    { "include": "#declaration" },
    { "include": "#builtin" },
    { "include": "#attribute" },
    { "include": "#keyword" },
    { "include": "#number" },
    { "include": "#operator" },
    { "include": "#punctuation" }
  ],
  "repository": {
    "comment": {
      "name": "comment.line.double-dash.gpr",
      "match": "(--).*$",
      "captures": {
        "1": { "name": "punctuation.definition.comment.gpr" }
      }
    },
    "string": {
      "name": "string.quoted.double.gpr",
      "match": "\"(?:[^\"]|\"\")*\""
    },
    "qualifier": {
      "comment": "abstract/aggregate/library/standard/configuration are keywords only where a qualifier can stand, immediately before 'project'; anywhere else the same spelling is a name.",
      "name": "keyword.other.gpr",
      "match": "(?i)\\b(abstract|aggregate|configuration|library|standard)(?=\\s+(?:library\\s+)?project\\b)"
    },
    "declaration": {
      "patterns": [
        {
          "match": "(?i)\\b(project)\\s+([A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*)",
          "captures": {
            "1": { "name": "keyword.other.gpr" },
            "2": { "name": "entity.name.namespace.gpr" }
          }
        },
        {
          "match": "(?i)\\b(package)\\s+([A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.gpr" },
            "2": { "name": "entity.name.namespace.gpr" }
          }
        },
        {
          "match": "(?i)\\b(type)\\s+([A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.gpr" },
            "2": { "name": "entity.name.type.gpr" }
          }
        },
        {
          "match": "(?i)\\b(end)\\s+([A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*)",
          "captures": {
            "1": { "name": "keyword.other.gpr" },
            "2": { "name": "entity.name.section.gpr" }
          }
        },
        {
          "match": "(?i)\\b(for)\\s+([A-Za-z][A-Za-z0-9_]*)",
          "captures": {
            "1": { "name": "keyword.other.gpr" },
            "2": { "name": "entity.other.attribute-name.gpr" }
          }
        }
      ]
    },
    "builtin": {
      "name": "support.function.gpr",
      "match": "(?i)\\b(external_as_list|external)\\b"
    },
    "attribute": {
      "match": "(')\\s*([A-Za-z][A-Za-z0-9_]*)",
      "captures": {
        "1": { "name": "punctuation.definition.attribute.gpr" },
        "2": { "name": "entity.other.attribute-name.gpr" }
      }
    },
    "keyword": {
      "patterns": [
        {
          "name": "constant.language.null.gpr",
          "match": "(?i)\\bnull\\b"
        },
        {
          "name": "keyword.other.gpr",
          "match": "(?i)\\b(all|at|case|end|extends|for|is|limited|others|package|project|renames|type|use|when|with)\\b"
        }
      ]
    },
    "number": {
      "name": "constant.numeric.gpr",
      "match": "\\b\\d+\\b"
    },
    "operator": {
      "name": "keyword.operator.gpr",
      "match": "(:=|=>|&|\\|)"
    },
    "punctuation": {
      "patterns": [
        { "name": "punctuation.terminator.gpr", "match": ";" },
        { "name": "punctuation.separator.gpr", "match": "[,:.]" },
        { "name": "punctuation.section.parens.gpr", "match": "[()]" }
      ]
    }
  }
}
</script>

<script id="syntaxes/gpj.tmLanguage.json" type="application/json">
{
  "$schema": "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json",
  "name": "Green Hills Project",
  "scopeName": "source.gpj",
  "comment": "A .gpj is read a line at a time, and each rule here claims exactly the lines the compiler's reader claims: the #!gbuild header, '#' comments, '-' options, 'macro' and key=value directives, and a [Tag] standing alone or after an entry. An entry's file name is left unscoped, so nothing can mis-color a path.",
  "patterns": [
    { "include": "#header" },
    { "include": "#comment" },
    { "include": "#option" },
    { "include": "#macro" },
    { "include": "#setting" },
    { "include": "#tag" }
  ],
  "repository": {
    "header": {
      "name": "comment.line.shebang.gpj",
      "match": "^#!gbuild\\b.*$"
    },
    "comment": {
      "comment": "Only a '#' first on its line comments; one inside an option or a path is part of it.",
      "name": "comment.line.number-sign.gpj",
      "match": "^\\s*(#).*$",
      "captures": {
        "1": { "name": "punctuation.definition.comment.gpj" }
      }
    },
    "option": {
      "match": "^\\s*(-[^\\s=]*)(=)?",
      "captures": {
        "1": { "name": "keyword.other.option.gpj" },
        "2": { "name": "keyword.operator.assignment.gpj" }
      }
    },
    "macro": {
      "match": "^\\s*(macro)\\s+([A-Za-z_][A-Za-z0-9_]*)\\s*(=)",
      "captures": {
        "1": { "name": "keyword.other.directive.gpj" },
        "2": { "name": "variable.other.macro.gpj" },
        "3": { "name": "keyword.operator.assignment.gpj" }
      }
    },
    "setting": {
      "comment": "A first word carrying '=' is a directive, primaryTarget=... being the common one; the reader warns about the unknown ones but reads them all.",
      "match": "^\\s*([A-Za-z_][A-Za-z0-9_]*)(=)",
      "captures": {
        "1": { "name": "variable.other.key.gpj" },
        "2": { "name": "keyword.operator.assignment.gpj" }
      }
    },
    "tag": {
      "match": "(\\[)([^\\]]+)(\\])",
